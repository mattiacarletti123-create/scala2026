<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<meta name="description" content="Scala il 2026: climber verticale. Sali di appiglio in appiglio e conta i metri.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Scala il 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
  :root{
    --void:#08080a;
    --panel:#15140f;
    --line:#2b2820;
    --yellow:#e8c21c;
    --yellow-hi:#f7e163;
    --yellow-lo:#7a6206;
    --navy:#232a3b;
    --bone:#f2efe6;
    --ash:#8c8678;
    --red:#d14a2e;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;padding:0;overscroll-behavior:none}
  body{
    background:var(--void);
    color:var(--bone);
    font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
    display:grid;place-items:center;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  /* La larghezza e limitata dall'altezza, non da un valore in pixel: cosi la
     colonna riempie lo schermo anche nelle WebView che ignorano il meta
     viewport e impaginano a 980px (browser interni di app come Google). */
  .stage{
    position:relative;
    width:min(100vw,58vh);
    width:min(100vw,58dvh);
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:var(--void);
    box-shadow:0 0 0 1px #1d1b16, 0 0 90px rgba(232,194,28,.07);
    /* base tipografica proporzionale, impostata da resize() */
    font-size:13px;
  }
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* ---------- HUD ---------- */
  .hud{
    position:absolute;inset:0 0 auto 0;
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:1em;padding:1.1em 1.3em;
    pointer-events:none;
    font-variant-numeric:tabular-nums;
  }
  .stat .k{
    display:block;font-size:.88em;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ash);font-weight:600;line-height:1;
  }
  .stat .v{
    display:block;font-family:"Archivo Black",Impact,sans-serif;
    font-size:2.4em;line-height:1;margin-top:.15em;
    color:var(--yellow);text-shadow:0 2px 0 var(--yellow-lo);
  }
  .stat.right{text-align:right}
  .stat.right .v{font-size:1.6em;color:var(--bone);text-shadow:none;margin-top:.45em}
  .sfx{
    pointer-events:auto;position:absolute;top:1.1em;left:50%;transform:translateX(-50%);
    width:2.7em;height:2.7em;border-radius:50%;
    border:1px solid var(--line);background:rgba(14,13,10,.7);color:var(--ash);
    font-size:1.2em;cursor:pointer;display:grid;place-items:center;
    font-family:inherit;padding:0;
  }
  .sfx:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

  /* ---------- pannelli ---------- */
  .panel{
    position:absolute;inset:0;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    gap:1.15em;padding:1.8em 1.6em;overflow:auto;
    background:linear-gradient(180deg,rgba(8,8,10,.72),rgba(8,8,10,.94));
    backdrop-filter:blur(3px);
    text-align:center;
  }
  .panel[hidden]{display:none}
  .eyebrow{
    font-size:.96em;letter-spacing:.34em;text-transform:uppercase;
    color:var(--yellow);font-weight:700;
  }
  h1{
    font-family:"Archivo Black",Impact,sans-serif;
    font-size:3.5em;line-height:.92;margin:0;
    text-wrap:balance;color:var(--bone);
  }
  h1 em{font-style:normal;color:var(--yellow);text-shadow:0 4px 0 var(--yellow-lo)}
  /* Schermata iniziale: l'immagine di campagna e il fondo, intera e a tutta
     altezza. Il suo nero e quello della pagina coincidono, quindi non si vede
     nessun bordo. Titolo, legenda e comandi stanno nelle fasce libere ai lati
     e alle estremita, ciascuno con la sua velatura scura per restare leggibile
     senza nascondere le cifre. */
  #panelStart{display:block;padding:0;background:#000;backdrop-filter:none}
  /* serve perche il selettore per id qui sopra batte .panel[hidden] */
  #panelStart[hidden]{display:none}
  /* La fascia dell'immagine si ferma sotto il titolo e sopra i comandi: cosi
     l'immagine si vede intera, niente la copre e non serve nessuna velatura
     addosso alle cifre. Sopra e sotto e gia nero pieno. */
  #panelStart .cover{
    position:absolute;top:5.5%;left:0;right:0;width:100%;height:81.5%;
    object-fit:contain;object-position:58% 50%;
  }

  .titolo{
    position:absolute;top:1.5em;left:0;right:0;z-index:2;text-align:center;
    font-family:"Archivo Black",Impact,sans-serif;font-size:1.9em;line-height:1;
    color:var(--bone);letter-spacing:.02em;
  }
  .titolo em{font-style:normal;color:var(--yellow)}

  .legend{
    position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:2;
    display:flex;flex-direction:column;align-items:flex-start;gap:.85em;
    padding:1.1em .9em 1.1em .8em;
    font-size:1.02em;color:#cbc6b8;
    background:linear-gradient(90deg,rgba(0,0,0,.90) 62%,transparent);
  }
  .legend span{display:flex;align-items:center;gap:.5em;white-space:nowrap}
  .legend b{
    display:block;width:1.5em;height:.72em;border-radius:3px 3px 5px 5px;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);flex:none;
  }
  .bottom{
    position:absolute;left:0;right:0;bottom:1.5em;z-index:2;
    display:flex;flex-direction:column;align-items:center;gap:1em;padding:0 1.4em;
  }
  .legend .s1{background:#2e8b72}
  .legend .s2{background:#d14a2e}
  .legend .s3{background:#4fb3c9}
  .legend .s4{   /* unta: trasparente come nel gioco, si riconosce dal bordo */
    background:rgba(198,206,216,.13);
    border:1px solid rgba(220,228,238,.55);box-shadow:none;
  }
  .legend .s6{   /* moneta: disco d'oro, tonda e non a lastra */
    width:.85em;height:.85em;border-radius:50%;box-shadow:none;
    background:radial-gradient(circle at 34% 30%,#f7e163,#e8c21c 58%,#7a6206);
  }
  .legend .s7{   /* mostro: bolla viola, l'unico colore non gia in parete */
    width:.9em;height:.9em;border-radius:50%;box-shadow:none;
    background:radial-gradient(circle at 34% 30%,#c07be0,#a24fc9 60%,#5f2a86);
  }
  .legend i{font-style:normal;color:var(--yellow);font-weight:700}

  .keys{font-size:1.12em;color:var(--ash);letter-spacing:.04em;margin:0}
  .keys kbd{
    font-family:inherit;font-size:.92em;border:1px solid var(--line);border-bottom-width:2px;
    border-radius:4px;padding:.08em .45em;color:#cbc6b8;background:#131209;
  }
  button.go{
    font-family:"Archivo Black",Impact,sans-serif;font-size:1.52em;letter-spacing:.06em;
    color:#151206;background:var(--yellow);
    border:0;border-bottom:4px solid var(--yellow-lo);border-radius:3px;
    padding:.72em 2.1em;cursor:pointer;
  }
  button.go:active{transform:translateY(2px);border-bottom-width:2px}
  button.go:focus-visible{outline:2px solid var(--bone);outline-offset:3px}

  .final{display:flex;gap:2.7em;align-items:flex-end;justify-content:center}
  .final .k{font-size:.88em;letter-spacing:.22em;text-transform:uppercase;color:var(--ash);font-weight:600}
  .final .v{font-family:"Archivo Black",Impact,sans-serif;font-size:3.5em;line-height:1;color:var(--yellow);font-variant-numeric:tabular-nums}
  .final .s .v{font-size:2.1em;color:var(--bone)}
  .verdict{margin:0;font-size:1.28em;color:#cbc6b8;max-width:28ch;min-height:2.4em}

  /* ---------- contatori monete e vite ----------
     Stanno nell'HUD sotto ai metri: sono informazioni permanenti, non
     messaggi che compaiono sopra la parete mentre si sale. */
  .gauge{
    display:flex;align-items:center;gap:.8em;margin-top:.55em;
    font-size:1.06em;font-weight:600;color:#cbc6b8;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .gauge>span{display:flex;align-items:center;gap:.3em;white-space:nowrap}
  .gauge .coin{
    width:.8em;height:.8em;border-radius:50%;flex:none;
    background:radial-gradient(circle at 34% 30%,var(--yellow-hi),var(--yellow) 58%,var(--yellow-lo));
  }
  .gauge .life{color:#f2efe6;letter-spacing:.08em}
  .gauge .life[hidden]{display:none}
  .gauge .life b{color:var(--yellow);font-weight:600;letter-spacing:0}

  /* ---------- pulsante di fuoco ----------
     Al centro in basso: le due meta dello schermo restano libere per gli
     spostamenti, che si comandano toccando la parete a destra o a sinistra.
     Tenendolo premuto la raffica continua. */
  .fire{
    position:absolute;left:50%;bottom:1.6em;transform:translateX(-50%);
    width:4.4em;height:4.4em;border-radius:50%;
    border:2px solid rgba(232,194,28,.55);
    background:radial-gradient(circle at 50% 34%,rgba(232,194,28,.20),rgba(14,13,10,.72));
    /* font-size:1em e obbligatorio: senza, il pulsante userebbe la misura di
       default dei form (13px) e le sue em non seguirebbero piu la colonna */
    color:var(--yellow);font-family:inherit;font-size:1em;padding:0;cursor:pointer;
    display:grid;place-items:center;
    touch-action:none;-webkit-tap-highlight-color:transparent;
  }
  .fire[hidden]{display:none}
  .fire svg{width:2.1em;height:2.1em;display:block}
  .fire.on{
    background:radial-gradient(circle at 50% 34%,rgba(232,194,28,.50),rgba(40,32,6,.85));
    transform:translateX(-50%) scale(.94);
  }
  .fire:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
</style>
</head>
<body>

<div class="stage" id="stage">
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="stat">
      <span class="k">Metri</span><span class="v" id="mScore">0</span>
      <div class="gauge">
        <span><b class="coin"></b><span id="mCoins">0/10</span></span>
        <span class="life" id="mLives" hidden></span>
      </div>
    </div>
    <button class="sfx" id="sfx" aria-label="Attiva o disattiva l'audio">&#9835;</button>
    <div class="stat right"><span class="k">Record</span><span class="v" id="mBest">0</span></div>
  </div>

  <button class="fire" id="btnFire" hidden aria-label="Spara">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 2 3.6 13.4h5.2V22h6.4v-8.6h5.2z" fill="currentColor"/>

  /* ---------- viewport virtuale ----------
     L'altezza visibile del mondo resta costante (~TARGET_H unita) su ogni
     schermo: cosi il personaggio e le prese hanno sempre la stessa dimensione
     apparente, che il telefono sia stretto e lungo o largo e corto. */
  var TARGET_H = 660;
  var W = 380, H = 660, SC = 1;
  function resize(){
    var r = stage.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var aspect = Math.max(1, r.height) / Math.max(1, r.width);
    var oldW = W;
    W = Math.round(Math.min(470, Math.max(300, TARGET_H / aspect)));
    H = Math.round(W * aspect);
    cvs.width  = Math.round(r.width * dpr);
    cvs.height = Math.round(r.height * dpr);
    SC = cvs.width / W;
    // tutta l'interfaccia in em: la base segue la larghezza reale della colonna,
    // cosi resta leggibile anche dove il meta viewport viene ignorato
    stage.style.fontSize = (r.width / 30).toFixed(2) + 'px';
    // dopo una rotazione le prese devono restare dentro la parete
    if (holds && oldW !== W){
      var k = W / oldW;
      for (var i=0;i<holds.length;i++){
        holds[i].x = Math.min(W - holds[i].w - 4, Math.max(4, holds[i].x * k));
      }
      if (player) player.x = Math.min(W - 6, Math.max(6, player.x * k));
    }
    misuraParete();     // le fasce dipendono da W
    brinaCvs = null;    // la brina si ridisegna sulla nuova misura
  }

  window.addEventListener('orientationchange', resize);

  };
  function meteoDi(k){ return METEO[(k >= 0 && MONDI[k]) ? MONDI[k] : 'parete']; }

  /* Le misure della parete dipendono da W, quindi si rifanno a ogni resize:
     ALT_CIFRE e l'altezza del blocco 2026, MH quella di una fascia di
     marchio, CICLO un giro completo. Sono l'unica sorgente: le usano il
     disegno della parete, il meteo e le voci. */
  var ALT_CIFRE = 0, MH = 0, GIRO = 0, CICLO = 0;
  function misuraParete(){
    ALT_CIFRE = CIFRE.length * SEG;
    MH        = W * MONDO_AR;
    GIRO      = MONDI.length * MH;      // un passaggio completo sui sei marchi
    CICLO     = ALT_CIFRE + GIRO;       // 2026 piu il primo giro: il tratto d'apertura
  }

  /* Dove siamo sulla parete: k vale -1 sul 2026 e 0-5 sui marchi, pos e la
     quota raggiunta dentro la fascia, giro conta i passaggi completi sui sei
     marchi e id identifica la fascia in modo unico.

     La parete del 2026 sta solo in fondo e si incontra una volta sola: da
     sopra le cifre i mondi si ripetono senza fine, e dopo pianegonda torna
     dhiva. Il 2026 e l'apertura, non un ritornello. */
  function fascia(u){
    if (u < ALT_CIFRE) return { k:-1, giro:0, pos:u, alt:ALT_CIFRE, id:'p0' };
    var q = u - ALT_CIFRE;
    var giro = Math.floor(q / GIRO);
    var k = Math.floor((q - giro * GIRO) / MH);
    if (k > MONDI.length - 1) k = MONDI.length - 1;
    return { k:k, giro:giro, pos:q - giro*GIRO - k*MH, alt:MH, id:'m' + giro + '_' + k };
  }

  /* ---------- il ritmo della salita ----------
     Il primo giro — quello che attraversa tutti e sei i marchi — resta
     facile: serve a far vedere i mondi, non a fermare la gente al terzo.
     Prese larghe, dislivelli corti, sassi lenti e nessun mostro.

     Passata pianegonda i mondi ricominciano da dhiva e la parete diventa
     un'altra cosa: la difficolta sale al massimo, entrano i mostri e le voci
     tacciono (resta solo la caduta). Cambiare i due numeri qui sotto sposta:
     FACILE e il tetto di difficolta del primo giro, SALITA quanti giri servono
     poi ad arrivare al massimo. */
  var FACILE = 0.30, SALITA = 0.75;
  function metriGiro(){ return CICLO / 11; }
  function difficolta(m){
    var g = metriGiro();
    if (m < g) return clamp(m / g, 0, 1) * FACILE;
    return clamp(FACILE + (m - g) / (g * SALITA) * (1 - FACILE), FACILE, 1);
  }

  var COL = {
    solid:  [['#2e8b72','#1a5c4b'],['#4f7ba8','#2f5279'],['#c2a57b','#8d7350'],['#3d8f5c','#255a39']],
    crumble:['#d14a2e','#8c2c17'],
    move:   ['#4fb3c9','#2b7388'],
    grease: ['#5a5a5e','#37373b']
  };

  /* ---------- stato ---------- */

  var player, holds, rocks, bits, cam, topGen, score = 0, shake = 0, nextRock = 0, milestone = 0;
  var shots, monete, mostri, nextMostro = 0, fireCd = 0;
  var borsa = 0, vite = 0, viteVinte = 0;
  var safe = null;     // ultimo appoggio afferrato: e il punto di rientro con le ali
  var best = 0, solidStreak = 0, untaPrec = false;
  var ancora = null;   // ultima presa da cui si puo spingere: riferimento per la verifica

  try { best = parseInt(localStorage.getItem('scala2026') || '0', 10) || 0; } catch(e){ best = 0; }
  if (!isFinite(best)) best = 0;
  elBest.textContent = best;

  function rnd(a,b){ return a + Math.random()*(b-a); }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  function mk(x,y,w,type,spd){
    var pal = type === 'solid' ? COL.solid[(Math.random()*COL.solid.length)|0] : COL[type];
    return {
      x:x, y:y, w:w, h:15, type:type, dead:0,
      f:pal[0], d:pal[1],
      dir: Math.random() < .5 ? -1 : 1,
      spd: spd
    };
  }

  /* ---------- garanzia di scalabilita' ----------------------------------
     C'e un solo appoggio per riga, quindi non esistono percorsi alternativi:
     una presa fuori portata non uccide il giocatore, lo intrappola a
     rimbalzare sotto all'infinito. Il salto e alto 194px ma il tempo di volo
     e poco piu di 40 fotogrammi, e in quel tempo lo spostamento laterale
     possibile e limitato: capita quindi che una presa sia sopra ma troppo di
     lato. Invece di stimarlo con una formula, ogni presa nuova viene provata
     con la fisica vera; se non ci si arriva viene avvicinata a quella di
     partenza e riprovata. Il collaudatore e volutamente pessimista: parte
     dalle due estremita dell'appoggio, con la spinta laterale contraria, e
     con la presa mobile che scappa in entrambi i versi.                    */
  var DAMP = 0.35;   // afferrando la presa la spinta laterale si smorza

  function arriva(da, y, x, w, tipo, spd, vx0, off, dirM){
    var px = da.x + da.w/2 + off*da.w, vx = vx0, py = da.y, vy = JUMP;
    var bx = x, bd = dirM;
    for (var f=0; f<220; f++){
      var d = bx + w/2 - px;
      var giro = d > 0 ? d - (W + PW) : d + (W + PW);   // passando da un bordo all'altro
      if (Math.abs(giro) < Math.abs(d)) d = giro;
      if (Math.abs(d) > 1.5) vx += d > 0 ? ACC : -ACC; else vx *= FRIC;
      vx = clamp(vx, -VMAX, VMAX);
      var prev = py;
      px += vx; vy += G; py += vy;
      if (px < -PW/2) px = W + PW/2;
      if (px > W + PW/2) px = -PW/2;
      if (tipo === 'move'){
        bx += bd * spd;
        if (bx < 4){ bx = 4; bd = 1; }
        if (bx + w > W - 4){ bx = W - 4 - w; bd = -1; }
      }
      if (vy > 0 && prev <= y && py >= y)
        return px + PW*0.34 > bx && px - PW*0.34 < bx + w;
      if (py > da.y + 40) return false;   // ricaduto sotto la partenza
    }
    return false;
  }

  function raggiungibile(da, y, x, w, tipo, spd){
    var v = VMAX * DAMP;
    for (var a=-1; a<=1; a++)
      for (var o=-1; o<=1; o+=2)
        for (var m=-1; m<=1; m+=2)
          if (!arriva(da, y, x, w, tipo, spd, a*v, o*0.4, m)) return false;
    return true;
  }

  function spawnRow(y, diff){
    var t = 'solid';
    var r = Math.random();
    if (solidStreak >= 2){
      if (r < .05 + diff*.05){ /* banda lasciata libera: qui stava la magnesite */ }
      else if (r < .16 + diff*.14) t = 'crumble';
      else if (r < .27 + diff*.26) t = 'move';
      else if (r < .32 + diff*.36 && diff > .18) t = 'grease';
    }

    var gap = rnd(74, 96) + diff*28;
    // l'unta e la presa subito sopra vanno saltate con un rimbalzo solo
    if (t === 'grease' || untaPrec) gap = Math.min(gap, GAP_UNTA);
    untaPrec = (t === 'grease');
    y -= gap;

    var w = Math.round(W * (rnd(0.19, 0.245) - diff*0.055));
    if (t === 'solid') solidStreak++; else solidStreak = 0;

    var spd = rnd(0.9, 2.1);
    var x = rnd(6, W - w - 6);

    /* Sull'unta non si rimbalza: non e un bersaglio, si piazza dove capita e
       l'ancora resta quella sotto, cosi la riga seguente viene verificata
       sul salto lungo che dovra davvero essere fatto. */
    if (t !== 'grease' && ancora){
      var c0 = ancora.x + ancora.w/2;
      var ok = false;
      for (var tent = 0; tent < 7; tent++){
        if (raggiungibile(ancora, y, x, w, t, spd)){ ok = true; break; }
        x = clamp(c0 + (x + w/2 - c0)*0.6 - w/2, 6, W - w - 6);   // avvicina e riprova
      }
      if (!ok) x = clamp(c0 - w/2, 6, W - w - 6);                 // in verticale si arriva sempre
    }

    var h = mk(x, y, w, t, spd);
    holds.push(h);
    if (t !== 'grease') ancora = h;

    /* La moneta si posa appena sopra l'appoggio, sulla traiettoria del
       rimbalzo: chi passa di li la prende senza deviare. Solo su prese ferme,
       perche su una mobile la moneta resterebbe indietro. */
    if ((t === 'solid' || t === 'crumble') &&
        Math.random() < COIN_P / (1 + viteVinte * COIN_RARITA)){
      monete.push({ x: h.x + h.w/2, y: y - 30, t: Math.random()*6.2832 });
    }
    return y;
  }

  function reset(){

    holds.push(ancora);

    var y = 40;
    while (y > cam - H*0.6) y = spawnRow(y, 0);

  }

  var CLIP_FILE = {
    sognare:   'sognare.mp3',     // parete del 2026, appena si parte
    presente:  'presente.mp3',    // parete del 2026, a mezza altezza
    dhiva:     'dhiva.mp3',
    cinturini: 'cinturini.mp3',
    sagapo:    'sagapo.mp3',
    rosato:    'rosato.mp3',
    brosway:   'brosway.mp3'
  };

  var voiceBuf = {}, voiceTried = {}, voiceEl = {};

  /* Le clip su file si cercano in due posti, come le foto: prima in audio/,
     poi accanto al gioco. Serve perche su GitHub i file trascinati uno per
     uno finiscono nella radice, mentre la cartella trascinata intera
     conserva il percorso. */
  function clipPath(nome, tent){ return (tent === 1 ? 'audio/' : '') + CLIP_FILE[nome]; }

  /* La posizione buona si scopre alla prima clip che arriva e da quel momento
     vale per tutte. Serve al ripiego con <audio>, che altrimenti continuerebbe
     a chiedere 'audio/...' anche quando i file stanno nella radice. */
  var clipBase = null;
  function clipURI(nome){
    if (CLIPS[nome]) return 'data:audio/mpeg;base64,' + CLIPS[nome];
    return (clipBase === null ? 'audio/' : clipBase) + CLIP_FILE[nome];
  }

  function loadClip(nome, tent){
    if (!CLIP_FILE[nome] || voiceBuf[nome]) return;
    if (!tent){ if (voiceTried[nome]) return; voiceTried[nome] = true; tent = 1; }
    if (!ensureAudio()){ voiceTried[nome] = false; return; }
    try{
      var xhr = new XMLHttpRequest();
      xhr.open('GET', clipPath(nome, tent), true);
      xhr.responseType = 'arraybuffer';
      xhr.onload = function(){
        if (xhr.status >= 200 && xhr.status < 300 && xhr.response){
          clipBase = tent === 1 ? 'audio/' : '';
          try{
            actx.decodeAudioData(xhr.response,
              function(b){
                voiceBuf[nome] = b;
                // se la frase era attesa da poco, parte adesso invece di perdersi
                if (daDire === nome && Date.now() < daDireFino){ daDire = null; say(nome); }
              },
              function(){ voiceTried[nome] = false; });
          } catch(e){ voiceTried[nome] = false; }
        }
        else if (tent < 2) loadClip(nome, 2);   // l'altra posizione, subito
        else voiceTried[nome] = false;
      };
      xhr.onerror = function(){
        if (tent < 2) loadClip(nome, 2); else voiceTried[nome] = false;
      };
      xhr.send();
    } catch(e){ voiceTried[nome] = false; }
  }

  // la voce di un mondo, chiesta insieme alla sua foto

  }

  function loadVoice(nome){
    if (voiceBuf[nome] || voiceTried[nome] || !ensureAudio()) return;

      var bin = atob(CLIPS[nome]), len = bin.length, bytes = new Uint8Array(len);
      for (var i=0;i<len;i++) bytes[i] = bin.charCodeAt(i);
      actx.decodeAudioData(bytes.buffer,
        function(b){ voiceBuf[nome] = b; },
        function(){ voiceTried[nome] = false; });
    } catch(e){ voiceTried[nome] = false; }
  }

    for (var k in CLIPS) loadVoice(k);

    voceInCorso.length = 0;
    for (k in voiceEl){
      try { voiceEl[k].pause(); voiceEl[k].currentTime = 0; } catch(e){}
    }
  }

  function say(nome){
    if (muted || (!CLIPS[nome] && !CLIP_FILE[nome])) return;
    var b = voiceBuf[nome];
    if (!b && CLIP_FILE[nome] && ensureAudio()){
      daDire = nome; daDireFino = Date.now() + 4000;
      loadClip(nome);
      return;
    }
    if (b && ensureAudio()){
      try{
        var src = actx.createBufferSource(), g = actx.createGain();
        src.buffer = b;
        g.gain.value = 0.95;
        src.connect(g); g.connect(actx.destination);
        voceInCorso.push(src);
        src.onended = function(){          // finita da sola: esce dalla lista
          for (var i=0;i<voceInCorso.length;i++){
            if (voceInCorso[i] === src){ voceInCorso.splice(i, 1); break; }
          }
        };
        src.start();
        return;
      } catch(e){}
    }
    try{
      if (!voiceEl[nome]) voiceEl[nome] = new Audio(clipURI(nome));
      voiceEl[nome].currentTime = 0;
      voiceEl[nome].volume = 1;
      voiceEl[nome].play();
    } catch(e){}
  }

  function tone(freq, dur, type, vol){
    if (muted) return;
    try{
      if (!ensureAudio()) return;
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || .045, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch(e){}
  }

  /* ---------- input ---------- */
  var left = false, right = false, firing = false;
  addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase();
    if (k === 'arrowleft'  || k === 'a') { left = true;  e.preventDefault(); }
    if (k === 'arrowright' || k === 'd') { right = true; e.preventDefault(); }
    if (k === 'arrowup'    || k === 'w') { firing = true; e.preventDefault(); }
    if (k === ' ' || k === 'enter'){
      // in partita la barra e il grilletto, fuori partita fa ripartire
      if (state === 'playing') firing = true; else start();
      e.preventDefault();
    }
  });
  addEventListener('keyup', function(e){
    var k = (e.key || '').toLowerCase();
    if (k === 'arrowleft'  || k === 'a') left = false;
    if (k === 'arrowright' || k === 'd') right = false;
    if (k === 'arrowup' || k === 'w' || k === ' ') firing = false;
  });
  function touch(e){
    if (state !== 'playing') return;
    left = right = false;
    var r = stage.getBoundingClientRect();
    for (var i=0;i<e.touches.length;i++){
      // il dito appoggiato sul pulsante di fuoco non deve spostare il
      // personaggio: e nella lista dei tocchi ma non e partito dalla parete
      if (e.touches[i].target !== cvs) continue;
      if (e.touches[i].clientX - r.left < r.width/2) left = true; else right = true;
    }
    e.preventDefault();
  }
  cvs.addEventListener('touchstart', touch, {passive:false});
  cvs.addEventListener('touchmove',  touch, {passive:false});
  cvs.addEventListener('touchend',   touch, {passive:false});
  cvs.addEventListener('mousedown', function(e){
    if (state !== 'playing') return;
    var r = stage.getBoundingClientRect();
    if (e.clientX - r.left < r.width/2) left = true; else right = true;
  });
  addEventListener('mouseup', function(){ left = right = false; });

  /* Pulsante di fuoco: si tiene premuto. Il preventDefault sul touchstart
     serve a non far arrivare anche il mousedown sintetico, che resterebbe
     senza il suo mouseup e lascerebbe la raffica accesa. */
  function fireOn(e){
    if (e && e.cancelable) e.preventDefault();
    if (state !== 'playing') return;
    firing = true;
    btnFire.classList.add('on');
  }
  function fireOff(){
    firing = false;
    btnFire.classList.remove('on');
  }
  btnFire.addEventListener('touchstart',  fireOn,  {passive:false});
  btnFire.addEventListener('touchend',    fireOff, {passive:false});
  btnFire.addEventListener('touchcancel', fireOff, {passive:false});
  btnFire.addEventListener('mousedown',   fireOn);
  addEventListener('mouseup',   fireOff);
  addEventListener('blur',      fireOff);

  document.getElementById('btnStart').addEventListener('click', start);
  document.getElementById('btnRetry').addEventListener('click', start);

  function start(){
    /* Chi riprova subito dopo una caduta lo fa mentre "hai perso" sta ancora
       parlando: senza questo si accavallava con "sognare in grande". */
    zittisci();
    reset();
    pStart.hidden = true; pOver.hidden = true;
    state = 'playing';
    left = right = false;
    fireOff();
    btnFire.hidden = false;
    caricaMondo(0);       // il primo mondo si scarica durante la salita del 2026
    caricaVoce(0);        // e con lui la sua voce
    ensureAudio();
    loadVoices();         // decodifica in anticipo: devono partire istantanee
    unlockVoiceEls();     // e sblocca il ripiego finche siamo dentro il tocco
    tone(520, .09, 'square', .05);
  }

  /* ---------- le voci dei mondi ----------
     La frase parte quando il personaggio entra nella fascia, una volta per
     fascia: rientrando dopo una morte non si ripete, ma al giro successivo —
     che e un'altra fascia — si. Sulla parete del 2026 ne parlano due, la
     prima appena si comincia a salire e la seconda a mezza parete, cosi non
     si accavallano.

     Il conto va sulla quota massima raggiunta, non su quella del momento:
     rimbalzando a cavallo di un confine la frase ripartirebbe ogni volta. */
  var fasciaPrec = null, presenteDetto = null;
  function voci(){
    var f = fascia(Math.max(0, -player.hi));
    // finiti i sei mondi la parete resta muta: parla solo la caduta
    if (f.giro > 0) return;
    if (f.id !== fasciaPrec){
      fasciaPrec = f.id;
      if (f.k >= 0){ if (MONDO_VOCE[f.k]) say(MONDO_VOCE[f.k]); }
      else say('sognare');
    }
    if (f.k < 0 && f.pos >= SEG * 2 && presenteDetto !== f.id){
      presenteDetto = f.id;
      say('presente');
    }
  }

  /* ---------- logica ---------- */
  function step(){
    if (state !== 'playing') return;
    var diff = difficolta(score);

    if (left)  player.vx -= ACC;
    if (right) player.vx += ACC;
    if (!left && !right) player.vx *= FRIC;
    player.vx = clamp(player.vx, -VMAX, VMAX);
    if (Math.abs(player.vx) > .4) player.face = player.vx > 0 ? 1 : -1;

    var prevBottom = player.y;
    player.x += player.vx;
    player.vy += G;
    player.y += player.vy;

    if (player.x < -PW/2) player.x = W + PW/2;
    if (player.x > W + PW/2) player.x = -PW/2;

    if (player.stun > 0) player.stun--;
    if (player.ali > 0) player.ali--;
    if (fireCd > 0) fireCd--;

    /* Raffica: finche il grilletto resta premuto parte un colpo ogni SHOT_CD
       fotogrammi. Da stordito non si spara. */
    if (firing && fireCd <= 0 && player.stun <= 0){
      shots.push({ x: player.x, y: player.y - PH*0.62, vy: -SHOT_V });
      fireCd = SHOT_CD;
      tone(1180, .04, 'square', .022);
    }

    for (var i=holds.length-1;i>=0;i--){
      var h = holds[i];
      if (h.type === 'move'){
        h.x += h.dir * h.spd;
        if (h.x < 4){ h.x = 4; h.dir = 1; }
        if (h.x + h.w > W - 4){ h.x = W - 4 - h.w; h.dir = -1; }
      }
      if (h.dead){
        h.dead++; h.y += h.dead * 0.9;
        if (h.dead > 40) holds.splice(i,1);
        continue;
      }
      if (h.y > cam + H + 140) { holds.splice(i,1); continue; }

      if (player.vy > 0 && player.stun <= 0 &&
          prevBottom <= h.y && player.y >= h.y && player.y <= h.y + h.h + player.vy &&
          player.x + PW*0.34 > h.x && player.x - PW*0.34 < h.x + h.w){

        if (h.type === 'grease'){
          puff(player.x, h.y, 4, '160,160,168', 1.4);
          tone(140, .12, 'sawtooth', .03);
          continue;
        }
        // afferrando la presa lo slancio laterale si smorza: senza questo si
        // riparte gia lanciati nel verso sbagliato e la presa dopo diventa
        // irraggiungibile. Stesso valore usato dalla verifica in spawnRow.
        player.vx *= DAMP;
        // ogni presa afferrata diventa il punto di rientro con le ali
        safe = { x: h.x + h.w/2, y: h.y };

        player.vy = JUMP;
        puff(player.x, h.y, 5, '236,232,220', 1.6);
        tone(330 + Math.random()*40, .06, 'square', .035);
        if (h.type === 'crumble'){
          h.dead = 1;
          puff(h.x + h.w/2, h.y + 6, 10, '209,74,46', 2.4);
          tone(190, .16, 'sawtooth', .04);
        }
      }
    }

    /* Sassi: piu piccoli e piu diradati di prima. Il raggio comanda anche
       l'area di collisione, quindi rimpicciolirli allarga il passaggio; la
       pausa fra due frane e circa il doppio. */
    if (score > 300){
      nextRock--;
      if (nextRock <= 0){
        nextRock = Math.round(rnd(170, 285) - diff*70);
        rocks.push({ x:rnd(30, W-30), y:cam - 60, vy:2.4 + diff*2.8, r:rnd(8,12.5), a:0, va:rnd(-.07,.07) });
      }
    }
    for (var j=rocks.length-1;j>=0;j--){
      var rk = rocks[j];
      rk.y += rk.vy; rk.a += rk.va;
      if (rk.y > cam + H + 80) { rocks.splice(j,1); continue; }
      if (player.stun <= 0 && player.ali <= 0 &&
          Math.abs(rk.x - player.x) < rk.r + PW*0.3 &&
          Math.abs(rk.y - (player.y - PH*0.45)) < rk.r + PH*0.4){
        player.stun = 34;
        player.vy = 7.5;
        player.vx = (player.x < rk.x ? -1 : 1) * 3.4;
        if (!REDUCED) shake = 14;
        puff(player.x, player.y - 30, 14, '209,74,46', 3.2);
        tone(90, .25, 'sawtooth', .06);
        rocks.splice(j,1);
      }
    }

    /* ---------- colpi ---------- */
    for (var s=shots.length-1;s>=0;s--){
      var sh = shots[s];
      sh.y += sh.vy;
      if (sh.y < cam - 40){ shots.splice(s,1); continue; }

      var colpito = false;
      for (var mi=mostri.length-1;mi>=0;mi--){
        var mo = mostri[mi];
        if (Math.abs(mo.x - sh.x) < MOSTRO_R + SHOT_R &&
            Math.abs(mo.y - sh.y) < MOSTRO_R + SHOT_R){
          puff(mo.x, mo.y, 16, '162,79,201', 2.8);
          mostri.splice(mi,1);
          colpito = true;
          tone(330, .16, 'sawtooth', .045);
          tone(150, .22, 'square', .028);
          break;
        }
      }
      /* Anche i sassi si sbriciolano: se il colpo valesse solo sui mostri,
         restare sotto una frana sarebbe ancora una condanna senza rimedio. */
      if (!colpito){
        for (var ri=rocks.length-1;ri>=0;ri--){
          var rr = rocks[ri];
          if (Math.abs(rr.x - sh.x) < rr.r + SHOT_R &&
              Math.abs(rr.y - sh.y) < rr.r + SHOT_R){
            puff(rr.x, rr.y, 10, '160,152,136', 2.4);
            rocks.splice(ri,1);
            colpito = true;
            tone(210, .12, 'sawtooth', .04);
            break;
          }
        }
      }
      if (colpito) shots.splice(s,1);
    }

    /* ---------- monete ---------- */
    for (var c=monete.length-1;c>=0;c--){
      var co = monete[c];
      co.t += 0.09;
      if (co.y > cam + H + 140){ monete.splice(c,1); continue; }
      if (Math.abs(co.x - player.x) < COIN_R + PW*0.42 &&
          Math.abs(co.y - (player.y - PH*0.42)) < COIN_R + PH*0.5){
        monete.splice(c,1);
        borsa++;
        puff(co.x, co.y, 7, '247,225,99', 1.8);
        tone(1050, .07, 'triangle', .04);
        if (borsa >= COIN_PER_VITA){
          borsa -= COIN_PER_VITA;
          vite++; viteVinte++;               // da qui le monete si diradano
          puff(player.x, player.y - PH*0.5, 26, '242,239,230', 3.2);
          tone(700, .16, 'triangle', .05);
          setTimeout(function(){ tone(1050, .3, 'triangle', .05); }, 130);
        }
        mostraContatori();
      }
    }

    /* ---------- mostri ----------
       Compaiono dal secondo giro: finiti i mondi, la parete si fa ostile. */
    if (score > metriGiro()){
      nextMostro--;
      if (nextMostro <= 0){
        nextMostro = Math.round(rnd(200, 330) - diff*70);
        /* Il mostro non traversa la parete: dondola appena attorno al punto in
           cui e comparso. MOSTRO_AMP e il massimo scostamento per lato, quindi
           il punto di comparsa si tiene a quella distanza dai bordi. */
        var amp = rnd(MOSTRO_AMP * 0.5, MOSTRO_AMP);
        var mx0 = rnd(MOSTRO_R + 6 + amp, W - MOSTRO_R - 6 - amp);
        mostri.push({
          x: mx0, x0: mx0, amp: amp,
          y: cam - 50,
          vy: MOSTRO_VY,
          t: Math.random()*6.2832
        });
      }
    }
    for (var m=mostri.length-1;m>=0;m--){
      var ms = mostri[m];
      ms.t += 0.11;
      // dondolio lento e stretto: un'andata e ritorno ogni tre secondi circa.
      // Il clamp serve solo dopo una rotazione dello schermo, quando la parete
      // cambia larghezza sotto ai mostri gia in scena.
      ms.x = clamp(ms.x0 + Math.sin(ms.t * 0.32) * ms.amp, MOSTRO_R + 4, W - MOSTRO_R - 4);
      ms.y += ms.vy;
      if (ms.y > cam + H + 90){ mostri.splice(m,1); continue; }

      if (Math.abs(ms.x - player.x) < MOSTRO_R + PW*0.30 &&
          Math.abs(ms.y - (player.y - PH*0.45)) < MOSTRO_R + PH*0.40){
        if (player.ali > 0) continue;        // rientro con le ali: intoccabile
        perdiVita();
        return;
      }
    }

    for (var b=bits.length-1;b>=0;b--){
      var p = bits[b];
      p.x += p.vx; p.y += p.vy; p.vy += .16; p.life -= .028;
      if (p.life <= 0) bits.splice(b,1);
    }

    if (player.y < cam + H*0.42) cam = player.y - H*0.42;
    while (topGen > cam - H*0.6) topGen = spawnRow(topGen, diff);

    if (player.y < player.hi) player.hi = player.y;
    voci();

    var m = Math.max(0, Math.round((40 - player.hi) / 11));
    if (m > score){
      score = m;
      elScore.textContent = score;
      // i traguardi restano, ma solo come suono: niente scritte sulla parete
      var marks = [100, 250, 500, 1000, 2026];
      while (milestone < marks.length && score >= marks[milestone]){
        tone(660, .1, 'triangle', .05);
        milestone++;
      }
    }

    if (shake > 0) shake *= .86;

    if (player.y > cam + H + 60) perdiVita();
  }

  /* Una vita spesa non azzera la salita: il personaggio rientra sull'ultimo
     appoggio afferrato, cioe' il punto da cui la generazione della parete
     garantisce che la presa successiva sia raggiungibile. Rientra gia in
     slancio, quindi non gli serve avere una lastra sotto i piedi. */
  function perdiVita(){
    if (vite <= 0){ gameOver(); return; }
    vite--;
    mostraContatori();

    rocks = []; mostri = []; shots = [];
    fireCd = SHOT_CD;
    player.x = clamp(safe.x, 8, W - 8);
    player.y = safe.y;
    player.vx = 0; player.vy = JUMP;
    player.stun = 0;
    player.ali = ALI_FRAMES;
    cam = player.y - H*0.42;

    if (!REDUCED) shake = 9;
    puff(player.x, player.y - PH*0.5, 22, '242,239,230', 3);
    tone(520, .12, 'triangle', .05);
    setTimeout(function(){ tone(790, .24, 'triangle', .045); }, 110);
  }

  function gameOver(){
    state = 'over';
    /* Prima di tutto silenzio: la frase del mondo va troncata sul colpo, cosi
       "hai perso" resta l'unica voce. I due tonfi restano, sono la caduta. */
    zittisci();
    fireOff();
    btnFire.hidden = true;
    var isRecord = score > best;
    if (isRecord){
      best = score;
      try { localStorage.setItem('scala2026', String(best)); } catch(e){}
    }
    elBest.textContent = best;
    document.getElementById('fScore').textContent = score;
    document.getElementById('fBest').textContent = best;
    var v;
    if (score < 60)       v = 'Sceso prima ancora di partire. Il 2026 e lungo, riprova.';
    else if (score < 200) v = 'Buon avvio, poi la presa ha ceduto. Serve piu ritmo.';
    else if (score < 500) v = 'Mezza parete fatta. Le prese invisibili non perdonano.';
    else if (score < 900) v = 'Salita solida. Ancora un tiro e sei in quota.';
    else                  v = 'Scalata da manuale. In pochi arrivano cosi in alto.';
    document.getElementById('verdict').textContent = v;
    document.getElementById('overTag').textContent = (isRecord && score > 0) ? 'Nuovo record' : 'Volo';
    pOver.hidden = false;
    tone(220, .2, 'sawtooth', .05);
    setTimeout(function(){ tone(140, .35, 'sawtooth', .05); }, 130);
    setTimeout(function(){ say('perso'); }, 420);   // la voce entra dopo il tonfo
  }

  /* ---------- disegno ---------- */
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  }

  function hash(n){ var s = Math.sin(n*127.1)*43758.5453; return s - Math.floor(s); }

  /* Le foto dei mondi si chiedono una alla volta, e si cercano in due posti:
     prima nella cartella mondi/, poi accanto al gioco. Serve perche su GitHub
     i file trascinati singolarmente finiscono nella radice mentre la cartella
     trascinata intera conserva il percorso: cosi il gioco funziona in
     entrambi i casi, senza dover rifare il caricamento.
     Esaurite le due posizioni si riprova un paio di volte per le reti lente,
     poi si lascia la fascia neutra invece di insistere a ogni fotogramma. */
  var mondoImg = [];
  function pathMondo(k, tent){
    return (tent === 1 ? 'mondi/' : '') + MONDI[k] + '.jpg';
  }
  function caricaMondo(k){
    k = ((k % MONDI.length) + MONDI.length) % MONDI.length;
    if (mondoImg[k]) return;
    var m = mondoImg[k] = { img: new Image(), ok: false, tent: 1 };
    m.img.onload  = function(){ m.ok = true; };
    m.img.onerror = function(){
      if (m.tent >= 4) return;
      m.tent++;
      // il cambio di posizione va provato subito, i ritentativi dopo una pausa
      var attesa = m.tent === 2 ? 0 : 4000;
      setTimeout(function(){
        m.img.src = pathMondo(k, m.tent) + (m.tent > 2 ? '?r=' + m.tent : '');
      }, attesa);
    };
    m.img.src = pathMondo(k, 1);
  }

  /* I bulloni sulla roccia: stessa mano su tutte le fasce, disposti da hash()
     cosi il motivo e sempre lo stesso a parita di fascia. */
  function bulloni(gi, y0, alt){
    ctx.fillStyle = 'rgba(0,0,0,.30)';
    for (var b=0;b<9;b++){
      var hx = 26 + hash(gi*31 + b)*(W-52);
      var hy = y0 + hash(gi*57 + b*7)*alt;
      ctx.beginPath(); ctx.arc(hx, hy, 3.1, 0, 6.2832); ctx.fill();
    }
  }

  function drawCifra(ch, u0, gi, fs){
    var cy = -(u0 + SEG/2) - cam;              // centro della fascia sullo schermo
    var wd = ctx.measureText(ch).width || fs*0.6;
    var k  = Math.min(1.2, (W*0.88) / wd);

    ctx.save();
    ctx.translate(W/2, cy);
    ctx.scale(k, k*1.05);

    ctx.fillStyle = '#6a5405';
    for (var e=16;e>=1;e--) ctx.fillText(ch, e*1.5, e*1.5);

    var g = ctx.createLinearGradient(0, -fs*0.5, 0, fs*0.5);
    g.addColorStop(0,   '#f2d43a');
    g.addColorStop(0.5, '#e8c21c');
    g.addColorStop(1,   '#c9a40f');
    ctx.fillStyle = g;
    ctx.fillText(ch, 0, 0);

    ctx.save();
    ctx.beginPath(); ctx.rect(-fs, -fs*0.54, fs*2, fs*0.16); ctx.clip();
    ctx.fillStyle = 'rgba(255,247,190,.40)';
    ctx.fillText(ch, 0, 0);
    ctx.restore();
    ctx.restore();

    bulloni(gi, cy - SEG*0.42, SEG*0.84);
  }

  function drawMondo(k, u0, alt, gi){
    var yTop = -(u0 + alt) - cam;              // bordo alto della fascia
    var m = mondoImg[k];

    if (!m || !m.ok){
      bulloni(gi, yTop + alt*0.08, alt*0.84);  // fascia neutra finche la foto arriva
      return;
    }

    var iw = m.img.naturalWidth  || m.img.width;
    var ih = m.img.naturalHeight || m.img.height;
    if (!iw || !ih) return;

    /* Piena larghezza e altezza dettata dalla proporzione: e il modo di
       mostrarla intera senza stirarla. Il mezzo punto di tolleranza evita che
       l'arrotondamento faccia scattare il rientro nel caso 9:16 esatto, che
       lascerebbe una riga scura fra due mondi. */
    var dw = W, dh = W * (ih / iw);
    if (dh > alt + 0.5){ dh = alt; dw = alt * (iw / ih); }

    ctx.drawImage(m.img, (W - dw)/2, yTop + (alt - dh)/2, dw, dh);

    /* Ogni marchio ha la sua velatura: sulle foto chiare serve piu scura
       perche prese e personaggio restino leggibili, su quelle gia scure si
       alleggerisce e la foto respira. */
    var velo = meteoDi(k).velo;
    if (velo > 0){
      ctx.fillStyle = 'rgba(8,8,10,' + velo + ')';
      ctx.fillRect(0, yTop, W, alt);
    }
  }

  /* ---------- neve ----------
     Uno sciame solo, riciclato: durante il gioco non si crea mai un fiocco.
     Due strati, uno dietro (sopra la foto, sotto prese e personaggio) e uno
     davanti a tutto, con parallasse diversa: salendo si attraversa la neve
     invece di guardarla cadere sul posto.

     Il disegno costa poche chiamate per strato, non una per fiocco: tutti i
     pallini in un unico path con un solo fill, tutti i cristalli in un unico
     path con un solo stroke. Nessuno shadowBlur, che e la cosa che ammazza
     il canvas sui telefoni.

     Posizione e velocita sono in frazioni di schermo, non in pixel: cosi una
     rotazione del telefono non sparpaglia lo sciame. */
  var NEVE_RETRO = 96, NEVE_FRONTE = 14;
  var neveR = [], neveF = [], camNevePrec = 0, tNeve = 0;
  var brinaCvs = null;
  // chi ha chiesto meno movimento al telefono ne riceve meno anche di neve
  var qual = REDUCED ? 0.4 : 1;

  function fiocco(){
    return { x:Math.random(), y:Math.random(), sd:Math.random(),
             sp:Math.random(), ph:Math.random()*6.2832,
             gk:0.6 + Math.random()*0.8 };
  }
  (function(){
    var i;
    for (i=0;i<NEVE_RETRO;i++)  neveR.push(fiocco());
    for (i=0;i<NEVE_FRONTE;i++) neveF.push(fiocco());
  })();

  /* Il profilo del punto in cui siamo, con la sfumatura fra due fasce: mezza
     schermata prima del confine il meteo comincia a diventare quello della
     fascia dopo, e mezza schermata dopo finisce di arrivare. Senza questo il
     cambio di mondo si vedrebbe come uno scatto. */
  var mOra = { n:0, rMin:1, rMax:2, vy:1, vento:0, raffA:0, raffT:4, raff:0,
               onda:0.3, forma:0, r:255, g:255, b:255,
               aRetro:0, aFronte:0, brina:0 };

  function lp(a, b, t){ return a + (b - a) * t; }

  function meteoOra(){
    var u = -(cam + H * 0.5);                  // il meteo lo detta il centro dello schermo
    var f = fascia(u);
    var a = meteoDi(f.k), b = a, t = 0;
    var mezzo = Math.min(H * 0.5, f.alt * 0.35);

    /* La fascia prima e quella dopo. Dopo pianegonda viene dhiva, non il 2026:
       da qui in su la neve non si interrompe mai piu. Il 2026 e sotto una volta
       sola, e solo il primo dhiva ha la parete muta alle spalle. */
    var giu = (f.giro === 0 && f.k === 0) ? -1 : (f.k + MONDI.length - 1) % MONDI.length;
    var su  = (f.k + 1) % MONDI.length;

    if (f.k < 0){
      t = 0;                                   // sulla parete del 2026 non nevica
    } else if (giu < 0 && f.pos < mezzo){
      // appena lasciato il 2026 la neve non arriva di colpo: sale dentro il mondo
      b = meteoDi(-1); t = 1 - f.pos / mezzo;
    } else if (f.alt - f.pos < mezzo){         // il confine fra due mondi sta arrivando
      b = meteoDi(su);
      t = 0.5 * (1 - (f.alt - f.pos) / mezzo);
    } else if (f.pos < mezzo){                 // il confine e appena passato
      b = meteoDi(giu);
      t = 0.5 * (1 - f.pos / mezzo);
    }

    mOra.n      = lp(a.n, b.n, t);
    mOra.rMin   = lp(a.r[0], b.r[0], t);
    mOra.rMax   = lp(a.r[1], b.r[1], t);
    mOra.vy     = lp(a.vy, b.vy, t);
    mOra.vento  = lp(a.vento, b.vento, t);
    mOra.raffA  = lp(a.raffA, b.raffA, t);
    mOra.raffT  = lp(a.raffT, b.raffT, t);
    mOra.onda   = lp(a.onda, b.onda, t);
    mOra.forma  = lp(a.forma, b.forma, t);
    mOra.r      = Math.round(lp(a.col[0], b.col[0], t));
    mOra.g      = Math.round(lp(a.col[1], b.col[1], t));
    mOra.b      = Math.round(lp(a.col[2], b.col[2], t));
    mOra.aRetro = lp(a.aRetro, b.aRetro, t);
    mOra.aFronte= lp(a.aFronte, b.aFronte, t);
    mOra.brina  = lp(a.brina, b.brina, t);
    return mOra;
  }

  /* Un passo dello sciame. dc e quanto si e mossa la telecamera: e da lui
     che nasce la parallasse. Si limita, cosi il rientro con le ali — che
     sposta la telecamera di colpo — non teletrasporta la neve. */
  function passoSciame(strato, p, par, dc){
    var lat = p.vento + p.raff;
    for (var i=0;i<strato.length;i++){
      var f = strato[i];
      f.y += (p.vy * (0.6 + f.sp * 0.8) - dc * par) / H;
      f.x += (lat * f.gk + Math.sin(tNeve * 1.7 + f.ph) * p.onda) / W;
      if (f.y >  1.02){ f.y -= 1.04; f.x = Math.random(); }
      else if (f.y < -0.02){ f.y += 1.04; f.x = Math.random(); }
      if (f.x < -0.02) f.x += 1.04;
      else if (f.x > 1.02) f.x -= 1.04;
    }
  }

  function passoNeve(){
    var p = meteoOra();
    tNeve += 1 / 60;
    p.raff = p.raffA * Math.sin(tNeve * 6.2832 / p.raffT);
    var dc = clamp(cam - camNevePrec, -H * 0.5, H * 0.5);
    camNevePrec = cam;
    if (p.n <= 0.01) return;                   // sul 2026 non c'e niente da muovere
    passoSciame(neveR, p, 0.35, dc);
    passoSciame(neveF, p, 0.72, dc);
  }

  /* Lo strato dietro: pallini in un fill, cristalli e strisce in uno stroke.
     I cristalli sono tre tratti incrociati, la classica stella a sei punte, e
     luccicano perche si dividono in due gruppi di opacita diversa. Quando la
     deriva laterale e forte i pallini diventano strisce inclinate: costa
     uguale e si legge subito come vento. */
  function drawNeveRetro(){
    var p = mOra;
    var alfa = p.aRetro;
    if (alfa <= 0.004 || p.n <= 0.01) return;
    var quanti = Math.round(neveR.length * p.n * qual);
    if (quanti < 1) return;

    var lat = p.vento + p.raff;
    var stria = Math.abs(lat) > 1.1;
    var col = p.r + ',' + p.g + ',' + p.b;
    var i, f, x, y, rr, an, l, b;

    ctx.fillStyle = 'rgba(' + col + ',' + alfa.toFixed(3) + ')';
    ctx.beginPath();
    for (i=0;i<quanti;i++){
      f = neveR[i];
      if (f.sd < p.forma || stria) continue;
      x = f.x * W; y = f.y * H;
      rr = p.rMin + f.sp * (p.rMax - p.rMin);
      ctx.moveTo(x + rr, y);
      ctx.arc(x, y, rr, 0, 6.2832);
    }
    ctx.fill();

    ctx.lineCap = 'round';
    for (b=0;b<2;b++){                         // due gruppi: uno luccica
      var af = b === 0 ? alfa : Math.min(0.95, alfa * 1.45);
      ctx.strokeStyle = 'rgba(' + col + ',' + af.toFixed(3) + ')';
      ctx.lineWidth = 1.05;
      ctx.beginPath();
      for (i=0;i<quanti;i++){
        f = neveR[i];
        var cristallo = f.sd < p.forma;
        if (!cristallo && !stria) continue;
        var lucido = Math.sin(tNeve * 3.1 + f.ph) > 0.45 ? 1 : 0;
        if (lucido !== b) continue;
        x = f.x * W; y = f.y * H;
        rr = p.rMin + f.sp * (p.rMax - p.rMin);
        if (cristallo){
          for (var t=0;t<3;t++){
            an = f.ph + t * 1.0472;
            ctx.moveTo(x - Math.cos(an) * rr, y - Math.sin(an) * rr);
            ctx.lineTo(x + Math.cos(an) * rr, y + Math.sin(an) * rr);
          }
        } else {
          l = rr * 1.6;
          ctx.moveTo(x, y);
          ctx.lineTo(x - lat * l * 0.9, y - p.vy * l);
        }
      }
      ctx.stroke();
    }
  }

  /* Lo strato davanti: pochi fiocchi, grandi e sfocati da un alone invece
     che da un blur. Sta sotto il 12% di opacita per non coprire mai una
     presa: e l'unico strato che potrebbe dare fastidio al gioco. */
  function drawNeveFronte(){
    var p = mOra;
    if (REDUCED) return;                       // lo strato davanti e il piu mosso
    if (p.aFronte <= 0.004 || p.n <= 0.01) return;
    var quanti = Math.round(neveF.length * p.n * qual);
    if (quanti < 1) return;
    var col = p.r + ',' + p.g + ',' + p.b;
    var g, i, f, x, y, rr;

    for (g=0;g<2;g++){
      var scala = g === 0 ? 2.05 : 1.0;
      var alfa  = p.aFronte * (g === 0 ? 0.40 : 1);
      ctx.fillStyle = 'rgba(' + col + ',' + alfa.toFixed(3) + ')';
      ctx.beginPath();
      for (i=0;i<quanti;i++){
        f = neveF[i];
        x = f.x * W; y = f.y * H;
        rr = (p.rMin + f.sp * (p.rMax - p.rMin)) * 1.9 * scala;
        ctx.moveTo(x + rr, y);
        ctx.arc(x, y, rr, 0, 6.2832);
      }
      ctx.fill();
    }
  }

  /* La brina di pianegonda: non fiocchi ma ghiaccio sul vetro. Si disegna una
     volta su una tela nascosta e da li si ricompone, quindi durante il gioco
     costa una sola drawImage. I cristalli si addensano sui bordi e il centro
     resta libero: e la parte dove si gioca. */
  function costruisciBrina(){
    var c = document.createElement('canvas');
    c.width  = Math.max(1, Math.round(W * SC));
    c.height = Math.max(1, Math.round(H * SC));
    var g = c.getContext('2d');
    g.setTransform(SC, 0, 0, SC, 0, 0);

    var rg = g.createRadialGradient(W/2, H/2, Math.min(W,H) * 0.20,
                                    W/2, H/2, Math.max(W,H) * 0.62);
    rg.addColorStop(0, 'rgba(190,220,255,0)');
    rg.addColorStop(1, 'rgba(190,220,255,0.40)');
    g.fillStyle = rg;
    g.fillRect(0, 0, W, H);

    /* I cristalli si raggruppano per opacita: cinque passate invece di una
       per cristallo. La tela si costruisce una volta sola, ma cosi non costa
       un sobbalzo nel fotogramma in cui la brina entra in scena. */
    g.lineCap = 'round';
    g.strokeStyle = 'rgba(228,241,255,1)';
    var GRUPPI = 5, gr, i;
    for (gr=0; gr<GRUPPI; gr++){
      var q = (gr + 0.5) / GRUPPI;
      g.globalAlpha = 0.20 + q * 0.55;
      g.lineWidth   = 0.55 + q * 0.85;
      g.beginPath();
      for (i=0;i<260;i++){
        var hx = hash(i * 3.7), hy = hash(i * 7.3 + 1.1);
        // spinge il punto verso il bordo piu vicino
        var bx = hx < 0.5 ? hx*hx*2 : 1 - (1-hx)*(1-hx)*2;
        var by = hy < 0.5 ? hy*hy*2 : 1 - (1-hy)*(1-hy)*2;
        var centro = Math.min(Math.min(bx, 1-bx), Math.min(by, 1-by)) * 2;
        var forza = 1 - centro;
        if (forza < 0.30) continue;
        if (Math.min(GRUPPI-1, Math.floor(forza * GRUPPI)) !== gr) continue;
        var x = bx * W, y = by * H;
        var l = (2.2 + hash(i * 11.9 + 2.3) * 7) * forza;
        var rot = hash(i * 5.1 + 3.7) * 3.1416;
        for (var t=0;t<3;t++){
          var an = rot + t * 1.0472;
          g.moveTo(x - Math.cos(an) * l, y - Math.sin(an) * l);
          g.lineTo(x + Math.cos(an) * l, y + Math.sin(an) * l);
        }
      }
      g.stroke();
    }
    return c;
  }

  function drawBrina(){
    if (mOra.brina <= 0.01) return;
    if (!brinaCvs) brinaCvs = costruisciBrina();
    ctx.save();
    ctx.globalAlpha = mOra.brina * 0.85;
    ctx.drawImage(brinaCvs, 0, 0, W, H);
    ctx.restore();
  }

  function drawWall(){
    ctx.fillStyle = '#08080a';
    ctx.fillRect(0,0,W,H);

    /* u misura la salita e cresce verso l'alto, dove y diventa negativa.
       Le misure arrivano da misuraParete(). */
    var uMin = -(cam + H), uMax = -cam;
    var s, u0;

    /* Le quattro cifre del 2026 stanno solo in fondo alla parete: si
       incontrano una volta sola, in apertura. Sotto lo zero non c'e niente,
       solo roccia: e il motivo per cui alla partenza non si intravede piu la
       cima di pianegonda. */
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var fs = 420;
    ctx.font = '400 ' + fs + 'px "Archivo Black", Impact, sans-serif';

    for (s=0; s<CIFRE.length; s++){
      u0 = s*SEG;
      if (u0 + SEG < uMin || u0 > uMax) continue;
      drawCifra(CIFRE[s], u0, s, fs);
    }

    /* Sopra le cifre i mondi si ripetono senza fine: passata pianegonda si
       ricomincia da dhiva. j conta le fasce da quando finisce il 2026, quindi
       il resto della divisione per sei dice di quale marchio si tratta e le
       foto tornano in ordine, sempre le stesse sei. */
    var jMin = Math.floor((uMin - ALT_CIFRE) / MH);
    var jMax = Math.floor((uMax - ALT_CIFRE) / MH);
    if (jMin < 0) jMin = 0;
    for (var j=jMin; j<=jMax; j++){
      u0 = ALT_CIFRE + j*MH;
      var k = j % MONDI.length;
      caricaMondo(k);
      caricaMondo(k + 1);                      // il prossimo si scarica in anticipo
      caricaVoce(k); caricaVoce(k + 1);        // e con lui la sua voce
      drawMondo(k, u0, MH, j);
    }

    var vg = ctx.createLinearGradient(0,0,0,H);
    vg.addColorStop(0,    'rgba(8,8,10,.88)');
    vg.addColorStop(0.16, 'rgba(8,8,10,0)');
    vg.addColorStop(0.84, 'rgba(8,8,10,0)');
    vg.addColorStop(1,    'rgba(8,8,10,.92)');
    ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
  }

  function drawHold(h){
    var y = h.y - cam;
    if (y < -40 || y > H + 40) return;
    ctx.save();
    ctx.globalAlpha = h.dead ? Math.max(0, 1 - h.dead/40) : 1;
    if (h.dead){
      ctx.translate(h.x + h.w/2, y + 8);
      ctx.rotate(h.dead * 0.05);
      ctx.translate(-(h.x + h.w/2), -(y + 8));
    }

    if (h.type === 'move'){
      ctx.strokeStyle = 'rgba(79,179,201,.30)';
      ctx.lineWidth = 2; ctx.setLineDash([5,6]);
      ctx.beginPath(); ctx.moveTo(6, y + 7); ctx.lineTo(W - 6, y + 7); ctx.stroke();
      ctx.setLineDash([]);
    }

    if (h.type === 'grease'){
      /* Vetro: attraverso la presa unta si vede la parete. Resta leggibile
         solo per il bordo e per i riflessi, quindi e la piu difficile da
         notare in tempo: e esattamente il suo ruolo nel gioco. */
      ctx.fillStyle = 'rgba(198,206,216,.13)';
      roundRect(h.x, y, h.w, h.h - 1, 6); ctx.fill();
      ctx.strokeStyle = 'rgba(220,228,238,.50)';
      ctx.lineWidth = 1.2;
      roundRect(h.x + 0.6, y + 0.6, h.w - 1.2, h.h - 2.2, 5.4); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.14)';
      roundRect(h.x + 2.5, y + 1.4, h.w - 5, 3, 1.6); ctx.fill();
    } else {
      ctx.fillStyle = h.d;
      roundRect(h.x, y + 3, h.w, h.h, 6); ctx.fill();
      ctx.fillStyle = h.f;
      roundRect(h.x, y, h.w, h.h - 1, 6); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.22)';
      roundRect(h.x + 3, y + 1.5, h.w - 6, 3.5, 2); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.42)';
      ctx.beginPath(); ctx.arc(h.x + h.w/2, y + 8, 2.6, 0, 6.2832); ctx.fill();
    }

    if (h.type === 'crumble'){
      ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(h.x + h.w*0.28, y + 1);
      ctx.lineTo(h.x + h.w*0.36, y + 8);
      ctx.lineTo(h.x + h.w*0.30, y + 14);
      ctx.moveTo(h.x + h.w*0.66, y + 1);
      ctx.lineTo(h.x + h.w*0.60, y + 9);
      ctx.stroke();
    }
    if (h.type === 'grease'){
      // due riflessi netti: l'unico appiglio visivo su una presa trasparente
      ctx.fillStyle = 'rgba(255,255,255,.62)';
      roundRect(h.x + h.w*0.14, y + 4.2, h.w*0.30, 2.4, 1.2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.30)';
      roundRect(h.x + h.w*0.60, y + 8, h.w*0.20, 1.8, 0.9); ctx.fill();
    }
    ctx.restore();
  }

  function drawRock(r){
    var y = r.y - cam;
    if (y < -60 || y > H + 60) return;
    ctx.save();
    ctx.translate(r.x, y); ctx.rotate(r.a);
    ctx.fillStyle = '#3a3730';
    ctx.beginPath();
    for (var i=0;i<7;i++){
      var ang = i/7*6.2832;
      var rad = r.r * (0.76 + hash(i*3.7 + Math.round(r.r))*0.44);
      if (i) ctx.lineTo(Math.cos(ang)*rad, Math.sin(ang)*rad);
      else   ctx.moveTo(Math.cos(ang)*rad, Math.sin(ang)*rad);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(232,194,28,.35)'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = '#d14a2e';
    roundRect(-r.r*0.4, -r.r*0.22, r.r*0.8, r.r*0.44, 3); ctx.fill();
    ctx.restore();
  }

  function drawCoin(c){
    var y = c.y - cam;
    if (y < -30 || y > H + 30) return;
    var giro = Math.abs(Math.cos(c.t));          // rotazione finta: si assottiglia
    ctx.save();
    ctx.translate(c.x, y + Math.sin(c.t * 0.7) * 2.2);
    ctx.scale(0.26 + giro * 0.74, 1);
    var g = ctx.createLinearGradient(0, -COIN_R, 0, COIN_R);
    g.addColorStop(0,    '#f7e163');
    g.addColorStop(0.55, '#e8c21c');
    g.addColorStop(1,    '#7a6206');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, COIN_R, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(58,44,4,.55)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, 0, COIN_R - 0.7, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = 'rgba(255,248,204,.55)';
    ctx.beginPath();
    ctx.ellipse(-COIN_R*0.3, -COIN_R*0.34, COIN_R*0.27, COIN_R*0.16, -0.5, 0, 6.2832);
    ctx.fill();
    ctx.restore();
  }

  function drawMostro(m){
    var y = m.y - cam;
    if (y < -60 || y > H + 60) return;
    var pulse = Math.sin(m.t) * 0.08;
    ctx.save();
    ctx.translate(m.x, y);

    ctx.strokeStyle = '#5f2a86'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    for (var i=-1;i<=1;i++){
      var ox = i * MOSTRO_R * 0.52, sway = Math.sin(m.t + i);
      ctx.beginPath();
      ctx.moveTo(ox, MOSTRO_R * 0.5);
      ctx.quadraticCurveTo(ox + sway*4, MOSTRO_R*0.95, ox + sway*7.5, MOSTRO_R*1.5);
      ctx.stroke();
    }

    var g = ctx.createRadialGradient(-MOSTRO_R*0.3, -MOSTRO_R*0.4, 1, 0, 0, MOSTRO_R*1.3);
    g.addColorStop(0,   '#c07be0');
    g.addColorStop(0.6, '#a24fc9');
    g.addColorStop(1,   '#5f2a86');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, MOSTRO_R * (1 + pulse), MOSTRO_R * (1 - pulse), 0, 0, 6.2832);
    ctx.fill();

    ctx.fillStyle = '#f2efe6';
    ctx.beginPath(); ctx.arc(-MOSTRO_R*0.34, -MOSTRO_R*0.16, MOSTRO_R*0.28, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc( MOSTRO_R*0.34, -MOSTRO_R*0.16, MOSTRO_R*0.28, 0, 6.2832); ctx.fill();

    // le pupille seguono il giocatore: si capisce a vista chi sta inseguendo chi
    var look = clamp((player.x - m.x) / 70, -1, 1) * MOSTRO_R*0.11;
    ctx.fillStyle = '#1c1024';
    ctx.beginPath(); ctx.arc(-MOSTRO_R*0.34 + look, -MOSTRO_R*0.14, MOSTRO_R*0.13, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc( MOSTRO_R*0.34 + look, -MOSTRO_R*0.14, MOSTRO_R*0.13, 0, 6.2832); ctx.fill();

    ctx.strokeStyle = '#3d1553'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, MOSTRO_R*0.26, MOSTRO_R*0.36, 0.25, 2.89); ctx.stroke();
    ctx.restore();
  }

  function drawShot(s){
    var y = s.y - cam;
    if (y < -20 || y > H + 20) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(247,225,99,.5)';
    ctx.lineWidth = SHOT_R * 1.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s.x, y + 10); ctx.lineTo(s.x, y); ctx.stroke();
    ctx.fillStyle = '#fff6c9';
    ctx.beginPath(); ctx.arc(s.x, y, SHOT_R, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  function drawPlayer(){
    var x = player.x, y = player.y - cam;
    var t = clamp(-player.vy / 14, -1, 1);
    var a = (t + 1) / 2;
    if (player.stun > 0) a = 0.12 + Math.sin(player.stun*0.7)*0.1;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(player.face, 1);

    /* Ali d'angelo: si vedono solo al rientro dopo una vita spesa. Battono
       piano e sfumano negli ultimi fotogrammi, cosi si capisce a vista fino a
       quando il personaggio e intoccabile. Si disegnano per prime: stanno
       dietro alle spalle. */
    if (player.ali > 0){
      var bat = Math.sin(player.ali * 0.24);
      ctx.save();
      ctx.globalAlpha = 0.5 + clamp(player.ali / 26, 0, 1) * 0.42;
      for (var al=-1; al<=1; al+=2){
        ctx.save();
        ctx.translate(al * 8, -46);
        ctx.rotate(al * (0.32 + bat * 0.26));
        ctx.fillStyle = '#f7f4ea';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(al*20, -21, al*30, -4);
        ctx.quadraticCurveTo(al*26,   6, al*17,  8);
        ctx.quadraticCurveTo(al*9,    9, 0,      0);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(176,172,160,.55)'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(al*6, 0.5); ctx.lineTo(al*24, -2.5);
        ctx.moveTo(al*6, 3.5); ctx.lineTo(al*20,  4);
        ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
    }

    var hipY = -26, shY = -50, headY = -62;
    var handX = 13 + (1-a)*15, handY = -84 + (1-a)*30;
    var footX = 10 + (1-a)*10, footY = -6 + (1-a)*8;

    ctx.lineCap = 'round';

    ctx.strokeStyle = '#1c2231'; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(-4, hipY); ctx.lineTo(-footX, footY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( 4, hipY); ctx.lineTo( footX, footY); ctx.stroke();

    ctx.fillStyle = '#0d0d10';
    ctx.beginPath(); ctx.ellipse(-footX-2, footY+2, 8, 4.2, -0.15, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse( footX+2, footY+2, 8, 4.2,  0.15, 0, 6.2832); ctx.fill();

    ctx.strokeStyle = '#232a3b'; ctx.lineWidth = 9.5;
    ctx.beginPath(); ctx.moveTo(-9, shY); ctx.lineTo(-handX, handY); ctx.stroke();

    ctx.fillStyle = '#f2efe6';
    roundRect(-11, shY - 2, 22, 30, 4); ctx.fill();

    ctx.fillStyle = '#232a3b';
    ctx.beginPath();
    ctx.moveTo(-16, shY - 4); ctx.lineTo(-4, shY - 4);
    ctx.lineTo(-9, hipY + 4); ctx.lineTo(-16, hipY + 6);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo( 16, shY - 4); ctx.lineTo( 4, shY - 4);
    ctx.lineTo( 9, hipY + 4); ctx.lineTo( 16, hipY + 6);
    ctx.closePath(); ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-16, hipY - 2); ctx.lineTo(-16 - (1-a)*10, hipY + 16); ctx.lineTo(-6, hipY + 8);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo( 16, hipY - 2); ctx.lineTo( 16 + (1-a)*12, hipY + 15); ctx.lineTo( 6, hipY + 8);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#0f1118';
    roundRect(-11, hipY + 1, 22, 4.5, 2); ctx.fill();

    var fw = 27, fh = 35, fy = headY - 3;
    if (faceOk){
      // il ritratto e frontale: riapplico la scala del corpo per annullarla,
      // cosi il volto non viene mai specchiato quando cambia direzione
      ctx.save();
      ctx.scale(player.face, 1);
      ctx.drawImage(FACE, -fw/2, fy - fh/2, fw, fh);
      ctx.restore();
      // la foto e gia scontornata: niente contorno, basta un'ombra morbida
      // che stacchi la testa dal giallo della parete
      ctx.save();
      ctx.globalCompositeOperation = 'destination-over';
      ctx.fillStyle = 'rgba(0,0,0,.30)';
      ctx.beginPath(); ctx.ellipse(0, fy + 1.5, fw/2 + 0.8, fh/2 + 0.8, 0, 0, 6.2832); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = '#d9ae8c';
      ctx.beginPath(); ctx.ellipse(1, headY, 10.5, 12, 0, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.22)';
      ctx.beginPath(); ctx.ellipse(-7, headY + 1, 2.6, 3.4, 0, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#3a2c22';
      ctx.beginPath(); ctx.ellipse(5, headY - 1, 3.4, 1.3, -0.2, 0, 6.2832); ctx.fill();
    }

    ctx.fillStyle = '#f2efe6';
    ctx.beginPath();
    ctx.moveTo(-7, shY - 3); ctx.lineTo(0, shY + 7); ctx.lineTo(7, shY - 3);
    ctx.closePath(); ctx.fill();

    ctx.strokeStyle = '#2c3549'; ctx.lineWidth = 9.5;
    ctx.beginPath(); ctx.moveTo(9, shY); ctx.lineTo(handX, handY); ctx.stroke();

    ctx.fillStyle = '#d9ae8c';
    ctx.beginPath(); ctx.arc(-handX, handY, 5, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc( handX, handY, 5, 0, 6.2832); ctx.fill();

    ctx.strokeStyle = '#f2efe6'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(-handX + 3, handY + 5, 4, 0, 3.2); ctx.stroke();
    ctx.beginPath(); ctx.arc( handX - 3, handY + 5, 4, 0, 3.2); ctx.stroke();

    ctx.restore();

    if (player.stun > 0 && Math.floor(player.stun/4) % 2 === 0){
      ctx.fillStyle = 'rgba(209,74,46,.26)';
      ctx.fillRect(0,0,W,H);
    }
  }

  function draw(){
    ctx.setTransform(SC, 0, 0, SC, 0, 0);
    ctx.save();
    if (shake > 0.4) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));

    drawWall();
    drawNeveRetro();          // sopra la foto, sotto prese e personaggio
    for (var i=0;i<holds.length;i++) drawHold(holds[i]);
    for (var c=0;c<monete.length;c++) drawCoin(monete[c]);
    for (var j=0;j<rocks.length;j++) drawRock(rocks[j]);
    for (var m=0;m<mostri.length;m++) drawMostro(mostri[m]);
    for (var s=0;s<shots.length;s++) drawShot(shots[s]);

    for (var b=0;b<bits.length;b++){
      var p = bits[b];
      ctx.fillStyle = 'rgba(' + p.c + ',' + p.life.toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y - cam, p.r, 0, 6.2832); ctx.fill();
    }

    drawPlayer();
    drawNeveFronte();         // davanti a tutto, tenuto trasparente
    drawBrina();
    ctx.restore();
  }

  /* ---------- loop ----------
     La guardia sulle prestazioni: se i fotogrammi si allungano lo sciame si
     dimezza da solo, e se serve si dimezza di nuovo. Su un telefono lento e
     meglio meno neve che meno gioco. */
  var acc = 0, last = 0, dtMedio = 16.7;
  function frame(ts){
    if (!last) last = ts;
    var dt = Math.min(50, ts - last); last = ts;
    dtMedio += (dt - dtMedio) * 0.04;
    if (dtMedio > 26 && qual > 0.36){
      qual = qual > 0.61 ? 0.6 : 0.35;
      dtMedio = 16.7;
    }
    acc += dt;
    while (acc >= 16.667){ step(); passoNeve(); acc -= 16.667; }
    draw();
    requestAnimationFrame(frame);
  }

  function boot(){
    resize();
    reset();
    // le due voci della parete si chiedono subito: servono nei primi metri
    loadClip('sognare'); loadClip('presente');
    requestAnimationFrame(frame);
  }

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot, boot);
  else boot();
})();
</script>
