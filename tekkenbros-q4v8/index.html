function resize(){
 DPR=Math.min(2,window.devicePixelRatio||1);
 const vw=innerWidth,vh=innerHeight,port=TOUCH&&vh>vw;
 SC=port?Math.min(vw/W,vh*0.5/H):Math.min(vw/W,vh/H);
 const gw=W*SC,gh=H*SC,gx=(vw-gw)/2,gy=port?vh*0.05:(vh-gh)/2;
 LAY={port,gx,gy,gw,gh,vw,vh};
 cv.style.left=gx+'px';cv.style.top=gy+'px';cv.style.width=gw+'px';cv.style.height=gh+'px';
 cv.width=Math.floor(gw*DPR);cv.height=Math.floor(gh*DPR);
 tc.style.width=vw+'px';tc.style.height=vh+'px';tc.width=Math.floor(vw*DPR);tc.height=Math.floor(vh*DPR);
 if(typeof G3!=='undefined'&&G3.ok){
  const s=G3.glc.style;s.left=gx+'px';s.top=gy+'px';s.width=gw+'px';s.height=gh+'px';
  G3.pr=G3.pr?Math.min(G3.pr,DPR,TOUCH?1.25:1.75):Math.min(DPR,TOUCH?1.25:1.75);
  G3.r.setPixelRatio(G3.pr);G3.r.setSize(gw,gh,false);
 }
 layoutTouch();
}
function layoutTouch(){
 const{port,gy,gh,vw,vh}=LAY;
 if(port){
  const ay=gy+gh,ah=vh-ay,sr=Math.min(vw*0.19,ah*0.3),br=Math.min(vw*0.095,ah*0.15),cy=ay+ah*0.5;
  STICK.x=vw*0.27;STICK.y=cy;STICK.r=sr;
  placeButtons(vw*0.72,cy,br);
  PAUSEBTN.x=vw/2;PAUSEBTN.y=vh-br*0.75;PAUSEBTN.r=br*0.5;

  const u=Math.min(vw,vh),sr=u*0.16,br=u*0.085;
  STICK.x=sr*1.45;STICK.y=vh-sr*1.4;STICK.r=sr;

/* ---------- utilità ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.random()*a.length|0];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a}
function seeded(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function shade(hex,p){
 let h=hex.slice(1);if(h.length===3)h=h.split('').map(c=>c+c).join('');
 const n=parseInt(h,16);let r=n>>16,g=n>>8&255,b=n&255;const t=p<0?0:255,a=Math.abs(p);
 r=Math.round((t-r)*a+r);g=Math.round((t-g)*a+g);b=Math.round((t-b)*a+b);return`rgb(${r},${g},${b})`;
}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2);ctx.fill();}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function txt(s,x,y,size,col,align='center',font=FONT,stroke=0,strokeCol=OUT){
 ctx.font=`${size}px ${font}`;ctx.textAlign=align;ctx.textBaseline='middle';
 if(stroke){ctx.lineWidth=stroke;ctx.strokeStyle=strokeCol;ctx.lineJoin='round';ctx.strokeText(s,x,y);}
 ctx.fillStyle=col;ctx.fillText(s,x,y);
}

/* ---------- audio ---------- */
let AC=null,master=null,musicOn=true,nbuf=null;
function audioUnlock(){
 if(AC){if(AC.state==='suspended')AC.resume();return}
 try{
  AC=new(window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);
  nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 }catch(e){AC=null}
}
function tone(type,f0,f1,dur,vol,delay=0){
 if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,vol,freq,q,type,delay=0,f1){
 if(!AC)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
 s.buffer=nbuf;f.type=type;f.frequency.setValueAtTime(freq,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q;
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
 s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.02);
}
const SFX={
 hit(p){noise(0.1+p*0.012,0.55,1100-p*45,0.8,'lowpass');tone('sine',190,40,0.12+p*0.012,0.6)},
 block(){noise(0.06,0.35,3200,2,'highpass');tone('square',900,500,0.05,0.1)},
 whoosh(){noise(0.13,0.16,900,1.5,'bandpass',0,2800)},
 jump(){tone('square',280,560,0.08,0.05)},

};
const music={on:false,step:0,next:0,timer:null};
const BASS=[45,0,45,57,0,45,55,0,43,0,43,55,0,43,52,0,41,0,41,53,0,41,52,0,40,0,40,52,0,47,48,50];
const midiF=n=>440*Math.pow(2,(n-69)/12);
function musicStart(){if(!AC||music.on)return;music.on=true;music.step=0;music.next=AC.currentTime+0.05;music.timer=setInterval(musicTick,50);}
function musicStop(){music.on=false;clearInterval(music.timer);}
function musicTick(){
 if(!AC)return;
 if(!musicOn){music.next=AC.currentTime+0.05;return}
 const spb=60/150/4;
 while(music.next<AC.currentTime+0.15){
  const s=music.step%32,t=Math.max(0,music.next-AC.currentTime),n=BASS[s];
  if(n)tone('sawtooth',midiF(n),midiF(n)*0.99,spb*0.9,0.06,t);
  if(s%4===0)tone('sine',150,40,0.12,0.3,t);
  if(s%8===4)noise(0.1,0.14,1800,0.8,'bandpass',t);
  if(s%2===1)noise(0.03,0.04,8000,1,'highpass',t);
  music.step++;music.next+=spb;
 }
}

let TAPQ=null,TAP=null,FS_TRIED=false;
const PTR=new Map();
const codBox=document.getElementById('codice');
function enableTouch(){if(TOUCH)return;TOUCH=true;resize()}
function stickMove(x,y){let dx=x-STICK.x,dy=y-STICK.y;const d=Math.hypot(dx,dy),m=STICK.r;if(d>m){dx*=m/d;dy*=m/d}STICK.px=dx;STICK.py=dy}
addEventListener('pointerdown',e=>{

 if(e.pointerType!=='mouse'){
  enableTouch();
  if(!FS_TRIED){FS_TRIED=true;try{const el=document.documentElement,p=el.requestFullscreen&&el.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}catch(err){}}
 }
 const x=e.clientX,y=e.clientY;
 if(TOUCH){
  if(STICK.id===null&&Math.hypot(x-STICK.x,y-STICK.y)<STICK.r*1.5){STICK.id=e.pointerId;stickMove(x,y);e.preventDefault();return}
  for(const b of BTN)if(Math.hypot(x-b.x,y-b.y)<b.r*1.12){PTR.set(e.pointerId,b);b.on=true;e.preventDefault();return}
  if(Math.hypot(x-PAUSEBTN.x,y-PAUSEBTN.y)<PAUSEBTN.r*1.4){PTR.set(e.pointerId,PAUSEBTN);PAUSEBTN.on=true;e.preventDefault();return}
 }
 const gx=(x-LAY.gx)/SC,gy=(y-LAY.gy)/SC;
 if(gx>=0&&gx<=W&&gy>=0&&gy<=H)TAPQ={x:gx,y:gy};
},{passive:false});
addEventListener('pointermove',e=>{if(e.pointerId===STICK.id)stickMove(e.clientX,e.clientY)});
function ptrUp(e){
 if(e.pointerId===STICK.id){STICK.id=null;STICK.px=0;STICK.py=0}
 const b=PTR.get(e.pointerId);if(b){b.on=false;PTR.delete(e.pointerId)}
}
addEventListener('pointerup',ptrUp);addEventListener('pointercancel',ptrUp);
addEventListener('contextmenu',e=>e.preventDefault());
function touchVal(k){
 if(!TOUCH)return false;
 const m=STICK.r,id=STICK.id!==null;
 if(k==='left')return id&&STICK.px<-m*0.35;
 if(k==='right')return id&&STICK.px>m*0.35;
 if(k==='up')return id&&STICK.py<-m*0.55;
 if(k==='down')return(id&&STICK.py>m*0.55)||BTN.some(b=>b.k==='down'&&b.on);
 if(k==='back')return PAUSEBTN.on;
 return BTN.some(b=>b.k===k&&b.on);
}
function tapped(x,y,w,h){if(TAP&&TAP.x>=x&&TAP.x<=x+w&&TAP.y>=y&&TAP.y<=y+h){TAP=null;return true}return false}
const MAP=[
 {left:['KeyA'],right:['KeyD'],up:['KeyW'],down:['KeyS'],punch:['KeyF'],kick:['KeyG'],special:['KeyH'],ok:['Enter','Space'],back:['Escape','Backspace']},
 {left:['ArrowLeft'],right:['ArrowRight'],up:['ArrowUp'],down:['ArrowDown'],punch:['Comma','Numpad1'],kick:['Period','Numpad2'],special:['Slash','Numpad3'],ok:['NumpadEnter'],back:[]}
];
const PADB={left:[14],right:[15],up:[12],down:[13],punch:[0,2],kick:[1,3],special:[4,5,6,7],ok:[9],back:[8]};
const CT=[0,1].map(()=>({h:{},l:{}}));
function pollInput(){
 let pads=[];try{pads=navigator.getGamepads?navigator.getGamepads():[]}catch(e){}
 for(let i=0;i<2;i++){
  const c=CT[i],m=MAP[i],pad=pads&&pads[i];
  for(const k in PADB){
   if(i===1&&NET.role==='host'){const v=!!NET.rin[k];if(v&&!c.h[k]&&(k==='left'||k==='right'||k==='up'||k==='down'))c.l[k]=true;c.h[k]=v;continue}
   let v=m[k].some(code=>keys.has(code));
   if(i===0&&touchVal(k))v=true;
   if(pad&&pad.connected){
    if(PADB[k].some(b=>pad.buttons[b]&&pad.buttons[b].pressed))v=true;
    const ax=pad.axes[0]||0,ay=pad.axes[1]||0;
    if((k==='left'&&ax<-0.5)||(k==='right'&&ax>0.5)||(k==='up'&&ay<-0.6)||(k==='down'&&ay>0.6))v=true;
   }
   if(v&&!c.h[k])c.l[k]=true;
   c.h[k]=v;
  }
 }
}
function clearLatches(){for(const c of CT)c.l={}}
function take(i,k){const c=CT[i];if(c.l[k]){c.l[k]=false;return true}return false}
function anyTake(...ks){for(const k of ks)for(let i=0;i<2;i++)if(take(i,k))return true;return false}

function humanIn(i){const h=CT[i].h;return{left:!!h.left,right:!!h.right,up:!!h.up,down:!!h.down,punch:take(i,'punch'),kick:take(i,'kick'),special:take(i,'special')}}

/* ---------- mosse ---------- */
const MOSSE={
 punch:   {su:4,act:3,rec:9, dmg:5,reach:70,hy:128,hh:42,kb:4,stun:16,step:2},
 cross:   {su:5,act:3,rec:11,dmg:6,reach:76,hy:126,hh:42,kb:5,stun:17,step:3},
 kick:    {su:8,act:4,rec:15,dmg:9,reach:96,hy:78, hh:50,kb:7,stun:19,step:2},
 airpunch:{su:3,act:7,rec:4, dmg:6,reach:66,hy:105,hh:50,kb:4,stun:16,air:true},
 airkick: {su:5,act:10,rec:4,dmg:8,reach:80,hy:32, hh:64,kb:6,stun:18,air:true},
 special: {su:13,act:1,rec:16,proj:'small'},
 super:   {su:8,act:1,rec:22,proj:'big'}
};
const TAGCOL=['#2ed573','#ffa502','#a55eea','#eccc68','#7bed9f','#70a1ff','#ff6b81'];

/* ---------- lottatore ---------- */
let NID=0,AID=0;
class Fighter{
 constructor(def,x,facing,slot){
  this.def=def;this.s=def.taglia;this.x=x;this.y=GROUND;this.vx=0;this.vy=0;this.facing=facing;
  this.slot=slot;this.cpu=null;this.id=++NID;this.color='#ccc';this.label='CPU';
  this.maxHp=100;this.hp=100;this.shownHp=100;this.meter=0;
  this.state='idle';this.st=0;this.anim=Math.random()*200;
  this.move=null;this.moveName='';this.chain=0;this.atkId=0;this.hitIds=new Set();this.hitLanded=false;
  this.input=NOIN;this.buffer=null;this.bufT=0;this.stun=0;this.flash=0;this.invul=0;this.combo=0;
  this.airAtk=false;this.guardT=0;this.lie=0;this.target=null;this.hs=0;
 }
 get grounded(){return this.y>=GROUND-0.01}
 get alive(){return this.state!=='ko'}
 body(){const s=this.s;return{x:this.x-26*s,y:this.y-195*s,w:52*s,h:195*s}}
 hitbox(){const m=this.move,s=this.s,x0=this.facing>0?this.x+10*s:this.x-10*s-m.reach*s;return{x:x0,y:this.y-m.hy*s-m.hh*s/2,w:m.reach*s,h:m.hh*s}}
 feed(I){
  this.input=I;
  if(I.punch){this.buffer='punch';this.bufT=8}
  if(I.kick){this.buffer='kick';this.bufT=8}
  if(I.special){this.buffer='special';this.bufT=8}
 }
 faceTarget(){const t=this.target;if(t&&Math.abs(t.x-this.x)>4)this.facing=t.x>this.x?1:-1}
 startAttack(n){
  this.move=MOSSE[n];this.moveName=n;this.state='attack';this.st=0;this.atkId=++AID;this.hitIds.clear();this.hitLanded=false;
  if(this.grounded)this.vx=(this.move.step||0)*this.facing;
 }
 trySpecial(g){
  if(this.meter>=100){this.meter=0;this.startAttack('super');g.superStart(this);return true}
  if(this.meter>=25){this.meter-=25;this.startAttack('special');SFX.special();return true}
  if(!this.cpu)SFX.nope();
  return false;
 }
 launch(g,big){
  const s=this.s;
  g.proj.push({id:++AID,x:this.x+this.facing*55*s,y:this.y-128*s,vx:this.facing*(big?10:9),owner:this,em:this.def.spec.em,
   size:big?120:50,r:big?48:20,dmg:big?24:10,big,rot:0,life:240});
 }
 update(g){
  const I=this.input;
  this.anim++;this.st++;
  if(this.flash>0)this.flash--;
  if(this.invul>0)this.invul--;
  if(this.bufT>0)this.bufT--;else this.buffer=null;
  if(this.state!=='ko')this.meter=Math.min(100,this.meter+0.03);
  this.shownHp=Math.max(this.hp,this.shownHp-0.45);
  switch(this.state){
   case 'idle':case 'walk':case 'guard':{
    if(this.guardT>0){this.guardT--;this.state='guard';break}
    this.faceTarget();
    if(this.buffer==='special'){this.buffer=null;if(this.trySpecial(g))break}
    if(this.buffer==='punch'||this.buffer==='kick'){const b=this.buffer;this.buffer=null;this.chain=0;this.startAttack(b);break}
    const d=(I.right?1:0)-(I.left?1:0);
    if(I.up){this.vy=-17;this.y-=1;this.vx=d*5.5*this.def.vel;this.state='jump';this.st=0;this.airAtk=false;SFX.jump();break}
    if(I.down){this.state='guard';this.vx=0;break}
    this.vx=d*4.3*this.def.vel*(d===this.facing?1:0.8);
    this.state=d?'walk':'idle';
    break;
   }
   case 'jump':
    if(!this.airAtk&&(this.buffer==='punch'||this.buffer==='kick')){const b=this.buffer;this.buffer=null;this.airAtk=true;this.startAttack(b==='punch'?'airpunch':'airkick')}
    break;
   case 'attack':{
    const m=this.move,rec=Math.round(m.rec/this.def.vel);
    if(m.proj){if(this.st===m.su)this.launch(g,m.proj==='big')}
    else{
     if(this.st===m.su)SFX.whoosh();
     if(this.st>=m.su&&this.st<m.su+m.act)g.checkHits(this);
    }
    if(this.hitLanded&&!m.air&&!m.proj&&this.st>=m.su&&this.chain<2&&(this.buffer==='punch'||this.buffer==='kick')){
     const next=this.buffer==='kick'?'kick':(this.moveName==='punch'?'cross':'punch');
     this.buffer=null;this.chain++;this.startAttack(next);break;
    }
    if(this.st>=m.su+m.act+rec){this.state=this.grounded?'idle':'jump';this.move=null;this.chain=0;this.st=0}
    break;
   }
   case 'hurt':
    if(--this.stun<=0){this.state='idle';this.combo=0}
    break;
   case 'down':
    if(this.grounded){this.lie++;if(this.lie>40){this.state='getup';this.st=0}}
    break;
   case 'getup':
    if(this.st>=22){this.state='idle';this.invul=20;this.combo=0}
    break;
   case 'win':this.vx=0;break;
  }
  // fisica
  if(this.y<GROUND||this.vy<0){
   this.vy+=GRAV;this.y+=this.vy;
   if(this.y>=GROUND){
    const v=this.vy;this.y=GROUND;this.vy=0;
    if((this.state==='down'||this.state==='ko')&&v>6){this.vy=-v*0.35;this.y=GROUND-0.5;g.dust(this.x,8);g.shake=Math.max(g.shake,4);SFX.land()}
    else this.land(g);
   }
  }
  this.x+=this.vx;
  const air=!this.grounded;
  if(!(this.state==='walk'||this.state==='jump'||(this.state==='attack'&&air)))this.vx*=air?0.98:0.82;
  this.x=clamp(this.x,45,W-45);
 }
 land(g){
  if(this.state==='jump'||(this.state==='attack'&&this.move&&this.move.air)){this.state='idle';this.st=0;this.move=null;this.vx=0;g.dust(this.x,4)}
 }
}

/* ---------- CPU ---------- */
class CPU{
 constructor(f,lvl){this.f=f;this.lvl=lvl;this.cool=40;this.plan=null;this.planT=0;this.queue=[];this.qT=0;this.guardT=0;this.seen=new Set();this.retarget=0;this.target=null}
 think(g){
  const f=this.f,L=this.lvl,I={left:false,right:false,up:false,down:false,punch:false,kick:false,special:false};
  if(this.seen.size>300)this.seen.clear();
  if(--this.retarget<=0||!this.target||!this.target.alive){
   const en=g.fighters.filter(o=>o!==f&&o.alive);
   if(!en.length){this.target=null;return I}
   en.sort((a,b)=>Math.abs(a.x-f.x)-Math.abs(b.x-f.x));
   this.target=Math.random()<0.75?en[0]:pick(en);this.retarget=90+Math.random()*120;
  }
  const tg=this.target;f.target=tg;
  const dx=tg.x-f.x,dist=Math.abs(dx),tow=dx>0?'right':'left',away=dx>0?'left':'right';
  if(this.guardT>0){this.guardT--;I.down=true;return I}
  if(tg.state==='attack'&&tg.move&&!tg.move.proj&&dist<170&&!this.seen.has(tg.atkId)){
   this.seen.add(tg.atkId);
   if(f.state!=='attack'&&Math.random()<L*0.6){this.guardT=12+tg.move.su;this.queue=[];I.down=true;return I}
  }
  for(const p of g.proj){
   if(p.owner===f||this.seen.has(p.id))continue;
   if(Math.sign(f.x-p.x)===Math.sign(p.vx)&&Math.abs(f.x-p.x)<280){
    this.seen.add(p.id);
    if(Math.random()<L*0.8){
     if(!p.big&&Math.random()<0.5){I.up=true;I[tow]=true;return I}
     this.guardT=28;I.down=true;return I;
    }
   }
  }
  if(this.queue.length){if(--this.qT<=0){I[this.queue.shift()]=true;this.qT=7}return I}
  if(--this.cool<=0){
   const react=Math.round(30-L*22);this.cool=react+Math.random()*react;
   const r=Math.random();this.plan=null;
   if(f.meter>=100&&dist>180&&r<0.5+L*0.3)this.queue=['special'];
   else if(dist>330){
    if(f.meter>=25&&r<0.25+L*0.15)this.queue=['special'];
    else if(Math.random()<0.1)this.plan='jumpin';
    else{this.plan='app';this.planT=20+Math.random()*30}
   }else if(dist>115){
    if(r<0.65){this.plan='app';this.planT=15+Math.random()*20}
    else if(r<0.8){this.plan='ret';this.planT=15}
    else if(f.meter>=25&&r<0.9)this.queue=['special'];
    else this.plan='jumpin';
   }else{
    if(r<0.42)this.queue=Math.random()<0.25+L*0.7?['punch','punch','kick']:['punch'];
    else if(r<0.72)this.queue=['kick'];
    else if(r<0.86){this.plan='ret';this.planT=12}
    else this.guardT=18;
   }
   this.qT=0;
  }
  if(this.plan==='app'&&this.planT-->0){if(dist>95)I[tow]=true}
  else if(this.plan==='ret'&&this.planT-->0)I[away]=true;
  else if(this.plan==='jumpin'){I.up=true;I[tow]=true;this.plan=null;this.queue=['kick'];this.qT=16}
  return I;
 }
}

/* ---------- pose e disegno dei personaggi ---------- */
function pose(f){
 const P={lf:[0.45,-0.05],lb:[-0.15,-0.45],af:[0.5,2.5],ab:[0.2,2.2],lean:0.08,bob:0,rot:0,lift:0,hipX:0,mouth:'flat',brow:0,ko:false};
 const t=f.anim,st=f.st;
 switch(f.state){
  case 'idle':P.bob=Math.sin(t*0.09)*2.5;P.af=[0.5,2.5+Math.sin(t*0.09)*0.1];P.mouth='smile';break;
  case 'walk':{
   const ph=t*0.2*f.def.vel,sw=Math.sin(ph)*0.5;
   P.lf=[0.15+sw,-0.1+sw*0.7];P.lb=[0.15-sw,-0.1-sw*0.7];P.bob=-Math.abs(Math.sin(ph))*3;P.mouth='smile';break;
  }
  case 'jump':
   P.lf=[1.1,-0.3];P.lb=[0.5,-0.7];P.af=[1.0,2.6];P.ab=[0.6,2.4];P.mouth='grit';
   if(f.vy>4){P.lf=[0.6,0.1];P.lb=[0.1,-0.2]}
   break;
  case 'guard':
   P.af=[0.95,3.0];P.ab=[0.75,2.95];P.lean=-0.05;P.lf=[0.5,0];P.lb=[-0.35,-0.5];P.mouth='grit';P.brow=1;
   if(f.guardT>0)P.hipX=-5;
   break;
  case 'attack':{
   const m=f.move,rec=Math.round(m.rec/f.def.vel);
   let e;if(st<m.su)e=-0.25*st/m.su;else if(st<m.su+m.act)e=1;else e=Math.max(0,1-(st-m.su-m.act)/rec);
   const ep=Math.max(0,e);P.mouth='grit';P.brow=1;
   switch(f.moveName){
    case 'punch':P.af=[lerp(0.5,1.62,ep),lerp(2.5,1.57,ep)];P.lean=0.08+e*0.18;P.lf=[0.55,0];break;
    case 'cross':P.ab=[lerp(0.2,1.66,ep),lerp(2.2,1.6,ep)];P.af=[0.6,2.7];P.lean=0.1+e*0.28;P.lf=[0.6,0.05];break;
    case 'kick':P.lf=[lerp(0.45,1.62,ep),lerp(-0.05,1.6,ep)];P.lb=[-0.1,-0.3];P.lean=0.08-ep*0.4;P.af=[0.9,1.9];P.ab=[-0.6,0.9];break;
    case 'airpunch':P.lf=[1.1,-0.3];P.lb=[0.5,-0.7];P.af=[lerp(0.8,1.2,ep),lerp(2.4,1.15,ep)];P.ab=[0.6,2.4];break;
    case 'airkick':P.lf=[lerp(1.1,1.0,ep),lerp(-0.3,0.95,ep)];P.lb=[0.5,-0.6];P.af=[1.6,2.6];P.ab=[-0.4,0.6];P.lean=-0.25*ep;break;
    default:{ // speciale / super: lancio
     if(st<m.su){const w=st/m.su;P.af=[lerp(0.5,-2.3,w),lerp(2.5,-2.6,w)];P.lean=-0.18*w}
     else{const r=Math.max(0,1-(st-m.su)/rec);P.af=[lerp(0.6,1.5,r),lerp(1.2,1.45,r)];P.lean=0.28*r}
     P.lf=[0.65,0.05];P.mouth='grin';
    }
   }
   break;
  }
  case 'hurt':P.lean=-0.35;P.af=[-0.4,0.6];P.ab=[-0.7,0.3];P.lf=[0.3,0.1];P.lb=[-0.4,-0.4];P.mouth='o';P.brow=-1;P.hipX=-6;break;
  case 'down':case 'ko':
   P.lf=[0.15,0.1];P.lb=[0.05,0];P.af=[-1.3,-1.6];P.ab=[-1.7,-1.9];P.mouth='o';P.brow=-1;P.ko=f.state==='ko';
   P.rot=f.grounded?-1.5:Math.max(-1.5,-0.3-st*0.06);P.lift=f.grounded?13*f.s:0;
   break;
  case 'getup':{const k=Math.min(1,st/20);P.rot=-1.5*(1-k);P.lift=13*f.s*(1-k);P.mouth='flat';break}
  case 'win':P.bob=-Math.abs(Math.sin(t*0.12))*14;P.af=[2.9,3.1];P.ab=[0.4,0.2];P.mouth='grin';P.lean=0;break;
 }
 return P;
}

   n.fromBufferAttribute(N,i).applyMatrix3(nm).normalize();nor.push(n.x,n.y,n.z);col.push(c.r,c.g,c.b);
  }
  if(g.index)for(let i=0;i<g.index.count;i++)idx.push(g.index.getX(i)+off);
  else for(let i=0;i<P.count;i++)idx.push(i+off);

}

function applyHit(att,d,m,dir,proj,hy){
 const s=d.s,hx=d.x-dir*18*s;
 const guarding=d.state==='guard'&&d.facing===-dir;
 let dmg=m.dmg*att.def.pot/d.def.dif;
 if(guarding){
  dmg*=m.big?0.35:0.12;d.hp=Math.max(1,d.hp-dmg);d.vx=dir*(m.kb||5)*0.9;d.guardT=Math.round((m.stun||18)*0.6);
  if(!proj)att.hitLanded=true;
  att.meter=Math.min(100,att.meter+2);d.meter=Math.min(100,d.meter+4);
  sparks(hx,hy,8,'#8fe3ff',false);SFX.block();
  if(F.cfg.mode!=='arena'){d.hs=Math.max(d.hs,2);if(!proj)att.hs=Math.max(att.hs,2)}
  return;
 }
 dmg*=Math.pow(0.88,d.combo);d.hp-=dmg;d.combo++;
 if(!proj)att.hitLanded=true;
 d.flash=6;att.meter=Math.min(100,att.meter+7);d.meter=Math.min(100,d.meter+5);
 const big=m.big||m.dmg>=9;
 const kd=m.kd||!d.grounded||(!proj&&att.moveName==='kick'&&att.chain>=2);
 d.move=null;d.guardT=0;
 if(d.hp<=0){d.hp=0;d.state='ko';d.st=0;d.vy=-13;d.vx=dir*9;d.y-=1;onKO(d,att)}
 else if(kd){d.state='down';d.st=0;d.lie=0;d.vy=-10;d.vx=dir*7;d.y-=1}
 else{d.state='hurt';d.st=0;d.stun=m.stun;d.vx=dir*m.kb}
 sparks(hx,hy,big?18:10,big?'#fff2a8':'#ffd32a',big);
 // fermo d'impatto solo per i due coinvolti, non per tutta la scena
 // nell'arena nessun fermo: con tanti lottatori faceva andare il gioco a scatti
 if(F.cfg.mode!=='arena'){const hs=big?5:3;d.hs=Math.max(d.hs,hs);if(!proj)att.hs=Math.max(att.hs,hs)}
 F.shake=Math.max(F.shake,(big?10:5)*(F.cfg.mode==='arena'?0.35:1));SFX.hit(m.dmg);

}

function fightStep(){

 }
 if(F.flashT>0)F.flashT--;
 if(F.banner&&++F.banner.t>F.banner.dur)F.banner=null;
 // la super ferma tutto solo nei duelli; nell'arena il gioco non si interrompe mai

  if(F.pt===1){
   if(arena){banner('ARENA',70,'#ffd32a',F.fighters.length+' LOTTATORI · '+F.stage.nome.toUpperCase());say('Arena')}

 }else if(F.phase==='fight'&&!arena&&F.pt%60===0&&F.timer>0){F.timer--;if(F.timer===0)F.timeup=true}
 for(const f of F.fighters){
  if(f.hs>0){f.hs--;continue}
  if(!f.cpu)f.target=nearestEnemy(f);f.update(F);
 }
 // separazione dei corpi
 const fs=F.fighters;
 for(let i=0;i<fs.length;i++)for(let j=i+1;j<fs.length;j++){
  const a=fs[i],b=fs[j];
  if(!a.alive||!b.alive||a.state==='down'||b.state==='down'||Math.abs(a.y-b.y)>110)continue;
  const ov=(26*a.s+26*b.s)-Math.abs(a.x-b.x);
  if(ov>0){const sgn=a.x<b.x?-1:a.x>b.x?1:(Math.random()<0.5?-1:1);a.x=clamp(a.x+sgn*ov/2,45,W-45);b.x=clamp(b.x-sgn*ov/2,45,W-45)}
 }
 // proiettili
 for(const p of F.proj){

  if(F.pt%2===0)F.parts.push({type:'spark',x:p.x-p.vx*2,y:p.y+rnd(-8,8),vx:-p.vx*0.2,vy:rnd(-1,1),life:14,max:14,col:p.big?'#ffd32a':'#fff',size:p.big?4:2});
  for(const f of F.fighters){
   if(f===p.owner||!f.alive||f.state==='down'||f.state==='getup'||f.invul>0)continue;
   const b=f.body();
   if(p.x+p.r>b.x&&p.x-p.r<b.x+b.w&&p.y+p.r>b.y&&p.y-p.r<b.y+b.h){
    applyHit(p.owner,f,{dmg:p.dmg,kb:p.big?9:6,stun:22,kd:p.big,big:p.big},p.vx>0?1:-1,true,p.y);p.dead=true;break;
   }
  }
 }
 for(const p of F.proj)for(const q of F.proj){
  if(p===q||p.dead||q.dead||p.owner===q.owner)continue;
  if(Math.abs(p.x-q.x)<(p.r+q.r)*0.8&&Math.abs(p.y-q.y)<70){
   if(p.big&&!q.big)q.dead=true;else if(q.big&&!p.big)p.dead=true;else{p.dead=true;q.dead=true}
   sparks((p.x+q.x)/2,(p.y+q.y)/2,14,'#fff',false);SFX.block();
  }
 }
 F.proj=F.proj.filter(p=>!p.dead);
 if(F.combo&&--F.combo.t<=0)F.combo=null;
 // fine round
 const alive=fs.filter(f=>f.alive);
 if(F.phase==='fight'){
  if(arena){
   if(alive.length<=1)endRound(alive[0]||null);
   else if(!F.spect&&!alive.some(f=>!f.cpu)){F.spect=true;banner('ELIMINATO!',90,'#ff4757','gli altri continuano senza di te...')}
  }else if(alive.length<2||F.timeup){
   let w=null;

   else if(alive.length===2){const a=fs[0].hp/fs[0].maxHp,b=fs[1].hp/fs[1].maxHp;w=a>b?fs[0]:b>a?fs[1]:null}

  }
 }else if(F.phase==='ko'){
  if(F.pt>=70&&F.winner&&F.winner.alive&&F.winner.grounded&&F.winner.state!=='win'&&F.winner.state!=='down'&&F.winner.state!=='getup'){F.winner.state='win';F.winner.st=0}

function step(){
 T++;
 switch(scene){
  case 'title':
   TITLE.t++;demo(TITLE.a);demo(TITLE.b);
   if(anyTake('ok','punch')||tapped(0,0,W,H)){audioUnlock();SFX.ok();goMenu()}
   break;
  case 'menu':{
   const N=MENU_ITEMS.length;
   if(anyTake('up')){MENU.i=(MENU.i+N-1)%N;SFX.move()}
   if(anyTake('down')){MENU.i=(MENU.i+1)%N;SFX.move()}
   const lr=(anyTake('right')?1:0)-(anyTake('left')?1:0),cur=MENU_ITEMS[MENU.i].id;
   if(lr&&cur==='diff'){OPT.diff=clamp(OPT.diff+lr,0,2);SFX.move()}
   if(lr&&cur==='arenaN'){OPT.arenaN=clamp(OPT.arenaN+lr,3,8);SFX.move()}
   if(anyTake('back')){SFX.back();goTitle();break}
   let go=anyTake('ok','punch');
   MENU_ITEMS.forEach((m,i)=>{if(tapped(W/2-320,menuY(i)-29,610,58)){MENU.i=i;go=true}});
   if(go){
    const id=MENU_ITEMS[MENU.i].id;
    if(id==='cpu'||id==='1v1'||id==='arena'){SFX.ok();goSelect(id)}
    else if(id==='online'){SFX.ok();goLobby()}
    else if(id==='diff'){OPT.diff=(OPT.diff+1)%3;SFX.move()}
    else if(id==='arenaN'){OPT.arenaN=OPT.arenaN>=8?3:OPT.arenaN+1;SFX.move()}
    else{SFX.ok();scene='controls'}
   }
   break;
  }
  case 'controls':if(anyTake('back','ok','punch')||tapped(0,0,W,H)){SFX.back();scene='menu'}break;
  case 'lobby':lobbyStep();break;
  case 'select':selectStep();break;
  case 'vs':
   VS.t++;
   if(VS.wait)break;
   if(VS.t>170||(VS.t>30&&(anyTake('ok','punch')||tapped(0,0,W,H)))){
    if(NET.role==='host')netSend({t:'fight'});
    startFight(VS.cfg);
   }
   break;
  case 'fight':
   if(NET.role==='guest')guestFightStep();
   else{fightStep();if(NET.role==='host'&&scene==='fight')netSend(makeSnap())}
   break;
  case 'result':{
   RES.t++;demo(RES.prev,true);const n=RES.opts.length;
   if(anyTake('up')){RES.i=(RES.i+n-1)%n;SFX.move()}
   if(anyTake('down')){RES.i=(RES.i+1)%n;SFX.move()}
   let go=RES.t>40&&anyTake('ok','punch');
   RES.opts.forEach((o,i)=>{if(RES.t>40&&tapped(660,393+i*66,470,54)){RES.i=i;go=true}});
   if(go){SFX.ok();resultAction(RES.opts[RES.i])}
   break;
  }
 }
}
function resultAction(o){

/* ---------- partita online (stanza con codice, collegamento diretto tra i due telefoni) ---------- */
const NET={role:null,peer:null,conn:null,code:'',status:'',err:'',rsel:{cur:1,lock:false},rin:{},ev:[],lastH:''};
const PEER_PREFIX='tekkenbros-mc-';
let NOTICE=null,LOBBY={i:0};
const myIdx=()=>NET.role==='guest'?1:0;
function encCfg(c){return{mode:c.mode,ids:c.defs.map(d=>d.id),ctrl:c.ctrl,lvl:c.lvl,stage:c.stage}}
function decCfg(c){return{mode:c.mode,defs:c.ids.map(id=>ROSTER.find(d=>d.id===id)||ROSTER[0]),ctrl:c.ctrl,lvl:c.lvl,stage:c.stage}}
function netLoad(){
 return new Promise((res,rej)=>{
  if(window.Peer)return res();
  const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
  s.onload=()=>window.Peer?res():rej();s.onerror=()=>rej();document.head.appendChild(s);
 });
}
function netErr(e){
 const t=e&&e.type;
 if(t==='peer-unavailable')return'Stanza '+NET.code+' non trovata: controlla il codice';
 if(t==='network'||t==='server-error'||t==='socket-error')return'Niente connessione a internet';
 if(t==='browser-incompatible')return'Questo browser non supporta il gioco online';
 return'Errore di connessione'+(t?' ('+t+')':'');
}
async function netHost(){
 netClose();NET.role='host';NET.err='';NET.status='Apro la stanza...';
 try{await netLoad()}catch(e){NET.err='Non riesco a caricare il gioco online: serve internet';NET.role=null;return}
 const open=()=>{
  NET.code=String(1000+Math.floor(Math.random()*9000));
  const p=new Peer(PEER_PREFIX+NET.code);NET.peer=p;
  p.on('open',()=>{NET.status='In attesa del collega...'});
  p.on('connection',c=>{if(NET.conn){c.close();return}netSetup(c)});
  p.on('error',e=>{if(e.type==='unavailable-id'){p.destroy();open()}else if(!NET.conn)NET.err=netErr(e)});
 };
 open();
}
async function netJoin(code){
 netClose();NET.role='guest';NET.code=code;NET.err='';NET.status='Mi collego alla stanza '+code+'...';
 try{await netLoad()}catch(e){NET.err='Non riesco a caricare il gioco online: serve internet';NET.role=null;return}
 const p=new Peer();NET.peer=p;
 p.on('open',()=>netSetup(p.connect(PEER_PREFIX+code,{reliable:true,serialization:'json'})));
 p.on('error',e=>{if(!NET.conn||!NET.conn.open)NET.err=netErr(e)});
}
function netSetup(c){
 NET.conn=c;
 c.on('open',()=>{NET.status='Collegati!';SFX.ok();goSelect('online')});
 c.on('data',onNet);
 c.on('close',netLost);
 c.on('error',netLost);
}
function netSend(o){if(NET.conn&&NET.conn.open){try{NET.conn.send(o)}catch(e){}}}
function netClose(){
 const c=NET.conn,p=NET.peer;NET.conn=null;NET.peer=null;NET.role=null;NET.rin={};NET.ev=[];
 try{c&&c.close()}catch(e){}try{p&&p.destroy()}catch(e){}
}
function netBye(){netSend({t:'bye'});setTimeout(netClose,200);NET.role=null}
function netLost(){
 if(!NET.role)return;
 netClose();NOTICE={text:'Collegamento interrotto',t:200};
 if(scene!=='lobby')goMenu();
}
function onNet(m){
 if(!m||typeof m!=='object')return;
 const guest=NET.role==='guest';
 switch(m.t){
  case 'sel':NET.rsel={cur:m.cur|0,lock:!!m.lock};break;
  case 'i':if(!guest){NET.rin=m.h||{};for(const k of m.p||[])if(k==='punch'||k==='kick'||k==='special')CT[1].l[k]=true}break;
  case 'vs':if(guest){scene='vs';VS={cfg:decCfg(m.cfg),t:0,wait:true};SFX.ok()}break;
  case 'fight':if(guest&&VS)startFight(VS.cfg);break;
  case 's':if(guest&&scene==='fight')applySnap(m);break;
  case 'res':if(guest&&scene==='fight'){applySnap(m.s);goResult()}break;
  case 'req':if(!guest&&scene==='result')resultAction(m.o);break;
  case 'go':if(guest&&m.to==='select')goSelect('online');break;
  case 'bye':NET.role&&(netClose(),NOTICE={text:"L'avversario è uscito",t:200},goMenu());break;
 }
}
function goLobby(){scene='lobby';LOBBY={i:0};NET.err=''}
function lobbyOpts(){return NET.role?['ANNULLA']:['CREA UNA STANZA','ENTRA CON UN CODICE','INDIETRO']}
function lobbyY(i,n){return n===1?610:330+i*80}
function lobbyStep(){
 if(!codBox.hidden)return;
 const o=lobbyOpts(),n=o.length;
 if(LOBBY.i>=n)LOBBY.i=0;
 if(anyTake('up')){LOBBY.i=(LOBBY.i+n-1)%n;SFX.move()}
 if(anyTake('down')){LOBBY.i=(LOBBY.i+1)%n;SFX.move()}
 if(anyTake('back')){SFX.back();if(NET.role)netClose();else goMenu();return}
 let go=anyTake('ok','punch');
 o.forEach((_,i)=>{if(tapped(W/2-300,lobbyY(i,n)-32,600,64)){LOBBY.i=i;go=true}});
 if(!go)return;
 SFX.ok();const a=o[LOBBY.i];
 if(a==='CREA UNA STANZA')netHost();

function demo(f,winOnly){
 if(!f)return;f.anim++;f.st++;
 if(winOnly){f.state='win';return}
 if(f.state==='attack'){const m=f.move;if(f.st>=m.su+m.act+m.rec){f.state='idle';f.move=null;f.st=0}}
 else if(f.st>70+Math.random()*40){const n=pick(['punch','cross','kick','punch']);f.state='attack';f.moveName=n;f.move=MOSSE[n];f.st=0}
}
function selectStep(){
 const S=SEL;S.t++;
 for(const p of S.prev)if(p)p.anim++;
 const online=S.mode==='online',me=myIdx();
 if(online){const o=1-me;if(S.lock[o]!==NET.rsel.lock&&NET.rsel.lock&&S.prev[o]){S.prev[o].state='win';S.prev[o].st=0}S.cur[o]=clamp(NET.rsel.cur,0,ROSTER.length-1);S.lock[o]=NET.rsel.lock}
 if(S.mode==='arena'&&!S.on[1]&&(take(1,'punch')||take(1,'ok'))){S.on[1]=true;S.cur[1]=(S.cur[0]+1)%ROSTER.length;refreshPreviews();SFX.ok()}
 const lockIt=i=>{S.lock[i]=true;SFX.ok();if(S.prev[i]){S.prev[i].state='win';S.prev[i].st=0}say(ROSTER[S.cur[i]].nome,'it-IT',1,1)};
 for(let i=0;i<2;i++){
  if(!S.on[i]||(online&&i!==me))continue;
  const ci=online?0:i,tapper=ci===0;
  let tk=-1;
  if(tapper)for(let k=0;k<ROSTER.length;k++){const r=cardRect(k);if(tapped(r.x,r.y,r.w,r.h)){tk=k;break}}
  if(!S.lock[i]){
   let c=S.cur[i],col=c%COLS,row=c/COLS|0;
   if(take(ci,'left')){col=(col+COLS-1)%COLS;SFX.move()}
   if(take(ci,'right')){col=(col+1)%COLS;SFX.move()}
   if(take(ci,'up')||take(ci,'down')){row=1-row;SFX.move()}
   c=row*COLS+col;if(c>=ROSTER.length)c=ROSTER.length-1;S.cur[i]=c;
   if(tk>=0){if(tk===S.cur[i])lockIt(i);else{S.cur[i]=tk;SFX.move()}}
   else if(take(ci,'punch')||take(ci,'ok'))lockIt(i);
   else if(take(ci,'kick')||take(ci,'back')){
    if(i===me){SFX.back();if(online)netBye();goMenu();return}
    else if(S.mode==='arena'){S.on[1]=false;SFX.back()}
   }
  }else if(tk>=0||take(ci,'kick')||take(ci,'back')){
   S.lock[i]=false;S.ready=0;SFX.back();if(S.prev[i])S.prev[i].state='idle';
   if(tk>=0)S.cur[i]=tk;
  }
 }
 refreshPreviews();
 if(online){const key=S.cur[me]+'/'+S.lock[me];if(key!==S.sent||S.t%60===0){S.sent=key;netSend({t:'sel',cur:S.cur[me],lock:S.lock[me]})}}
 const all=S.on.every((o,i)=>!o||S.lock[i]);
 if(!all){S.ready=0;return}
 if(online){
  if(me===0&&++S.ready>45){
   const cfg={mode:'online',defs:[ROSTER[S.cur[0]],ROSTER[S.cur[1]]],ctrl:[0,1],lvl:0.5,stage:Math.random()*STAGES.length|0};
   goVS(cfg);netSend({t:'vs',cfg:encCfg(cfg)});
  }
  return;
 }
 if(S.mode==='arena'&&TAP){TAP=null;CT[0].l.ok=true}
 if(S.mode==='arena'){
  if(S.ready++>10&&(take(0,'ok')||take(0,'punch')||take(1,'ok')||take(1,'punch'))){
   const defs=[ROSTER[S.cur[0]]],ctrl=[0];
   if(S.on[1]){defs.push(ROSTER[S.cur[1]]);ctrl.push(1)}
   const rest=shuffle(ROSTER.filter(d=>!defs.includes(d)));
   while(defs.length<OPT.arenaN&&rest.length){defs.push(rest.shift());ctrl.push('cpu')}
   const order=shuffle(defs.map((d,i)=>i));
   goVS({mode:'arena',defs:order.map(i=>defs[i]),ctrl:order.map(i=>ctrl[i]),lvl:DIFFS[OPT.diff].l,stage:Math.random()*STAGES.length|0});
  }
 }else if(++S.ready>45){
  if(S.mode==='cpu'){LADDER=buildLadder(ROSTER[S.cur[0]]);goVS(ladderCfg())}
  else goVS({mode:'1v1',defs:[ROSTER[S.cur[0]],ROSTER[S.cur[1]]],ctrl:[0,1],lvl:0.5,stage:Math.random()*STAGES.length|0});
 }
}

/* ---------- scene: disegno ---------- */
function bgFX(c1,c2,t){
 const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.globalAlpha=0.07;ctx.fillStyle='#fff';
 const o=(t*1.5)%80;
 for(let x=-H-80+o;x<W+80;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+30,0);ctx.lineTo(x+30+H,H);ctx.lineTo(x+H,H);ctx.fill()}
 ctx.restore();
}
function logo(x,y,k){

  const sc=1+Math.max(0,F.combo.t-60)*0.05;
  ctx.save();ctx.translate(left?150:W-150,240);ctx.scale(sc,sc);
  txt(F.combo.n+' COLPI',0,0,48,'#ffd32a','center',FONT,6);txt('COMBO!',0,42,28,'#fff','center',FONT,5);ctx.restore();
 }
 if(F.superT>0){
  const f=F.superF,k=1-F.superT/55;
  if(F.cfg.mode!=='arena'){ctx.fillStyle=G3.ok?'rgba(0,0,0,0.35)':'rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H)}
  if(!G3.ok)drawFighter(f,false);
  const by=H/2-70;ctx.save();ctx.globalAlpha=Math.min(1,k*4);
  const g=ctx.createLinearGradient(0,by,W,by);g.addColorStop(0,f.color);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,by,W,140);
  const hx=lerp(-100,200,Math.min(1,k*3));
  ctx.save();rr(hx-80,by+5,160,130,0);ctx.clip();drawHead(f.def,hx,by+75,62,1,'grin',1,false);ctx.restore();
  txt('SUPER',320+(1-Math.min(1,k*3))*200,by+38,32,'#ffd32a','left',FONT,5);
  txt(f.def.sup.toUpperCase(),320+(1-Math.min(1,k*3))*300,by+90,58,'#fff','left',FONT,7);
  ctx.restore();
 }
 if(F.banner){
  const b=F.banner,k=Math.min(1,b.t/8),sc=lerp(2.2,1,k),fade=Math.min(1,(b.dur-b.t)/10);
  ctx.save();ctx.globalAlpha=fade;ctx.translate(W/2,H/2-40);ctx.scale(sc,sc);
  txt(b.text,0,0,b.text.length>12?72:110,b.col,'center',FONT,10);
  if(b.sub)txt(b.sub,0,b.text.length>12?60:80,28,'#fff','center',FONT,5);
  ctx.restore();
 }
 if(F.flashT>0){ctx.fillStyle=`rgba(255,255,255,${F.flashT/14})`;ctx.fillRect(0,0,W,H)}
 if(F.paused){
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
  txt('PAUSA',W/2,220,90,'#fff','center',FONT,8);
  if(F.cfg.mode==='online')txt('la partita continua!',W/2,290,24,'#ffd32a','center',FONT2,4);
  pauseOpts().forEach((o,i)=>{
   const y=360+i*64,sel=F.pi===i;
   if(sel){ctx.fillStyle='#ff4757';rr(W/2-200,y-26,400,52,8);ctx.fill()}
   txt(o.toUpperCase(),W/2,y,34,sel?'#fff':'rgba(255,255,255,0.6)','center',FONT,sel?4:0);
  });
 }else if(F.phase==='fight'&&F.cfg.mode==='arena'&&!TOUCH)txt('ESC pausa',W/2,704,14,'rgba(255,255,255,0.45)','center',FONT2);
}
function drawResult(){
 const R=RES;
 drawStage(R.stage,T);
 const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(0,0,0,0.25)');g.addColorStop(0.55,'rgba(0,0,0,0.85)');g.addColorStop(1,'rgba(0,0,0,0.92)');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 if(R.prev)drawFighters([R.prev]);
 const x=700;
 txt(R.title,x,150,R.title.length>20?40:70,R.cfg.mode==='cpu'&&!R.won?'#ff4757':'#ffd32a','left',FONT,8);
 txt(R.sub,x,215,26,'#fff','left',FONT2);
 if(R.wdef){
  txt('“'+R.wdef.frase+'”',x,275,26,'#fff','left',FONT2);
  txt('— '+R.wdef.nome+', '+R.wdef.reparto,x,312,20,'#aaa','left',FONT2);
 }
 R.opts.forEach((o,i)=>{
  const y=420+i*66,sel=R.i===i;
  if(sel){ctx.fillStyle='#ff4757';ctx.beginPath();ctx.moveTo(x-20,y-27);ctx.lineTo(x+430,y-27);ctx.lineTo(x+410,y+27);ctx.lineTo(x-40,y+27);ctx.fill()}
  txt(o.toUpperCase(),x,y,34,sel?'#fff':'rgba(255,255,255,0.6)','left',FONT,sel?4:0);
 });
 if(R.wait)txt('Richiesta inviata, decide chi ha creato la stanza',x,640,20,'#ffd32a','left',FONT2);
}
/* tasti sullo schermo del telefono */
function drawTouch(){
 tctx.setTransform(1,0,0,1,0,0);tctx.clearRect(0,0,tc.width,tc.height);
 if(!TOUCH)return;
 tctx.setTransform(DPR,0,0,DPR,0,0);
 const port=LAY.port,a=port?0.9:0.38;
 if(port){
  const y0=LAY.gy+LAY.gh,g=tctx.createLinearGradient(0,y0,0,LAY.vh);g.addColorStop(0,'#1a0f24');g.addColorStop(1,'#07050a');
  tctx.fillStyle=g;tctx.fillRect(0,y0,LAY.vw,LAY.vh-y0);
 }
 const S=STICK;
 tctx.globalAlpha=a;
 tctx.fillStyle='rgba(255,255,255,0.08)';tctx.strokeStyle='rgba(255,255,255,0.5)';tctx.lineWidth=Math.max(2,S.r*0.04);
 tctx.beginPath();tctx.arc(S.x,S.y,S.r,0,Math.PI*2);tctx.fill();tctx.stroke();
 tctx.fillStyle='rgba(255,255,255,0.35)';
 for(const[dx,dy]of[[0,-1],[0,1],[-1,0],[1,0]]){
  const cx=S.x+dx*S.r*0.78,cy=S.y+dy*S.r*0.78,k=S.r*0.1;
  tctx.beginPath();tctx.moveTo(cx+dx*k,cy+dy*k);tctx.lineTo(cx-dy*k-dx*k*0.6,cy+dx*k-dy*k*0.6);tctx.lineTo(cx+dy*k-dx*k*0.6,cy-dx*k-dy*k*0.6);tctx.fill();
 }
 tctx.fillStyle='#ff4757';tctx.beginPath();tctx.arc(S.x+S.px,S.y+S.py,S.r*0.42,0,Math.PI*2);tctx.fill();
 tctx.strokeStyle='#fff';tctx.stroke();
 tctx.textAlign='center';tctx.textBaseline='middle';
 for(const b of BTN){
  tctx.globalAlpha=a*(b.on?1:0.85);
  tctx.fillStyle=b.on?'#fff':b.col;tctx.beginPath();tctx.arc(b.x,b.y,b.r*(b.on?0.94:1),0,Math.PI*2);tctx.fill();
  tctx.strokeStyle='rgba(0,0,0,0.5)';tctx.lineWidth=Math.max(2,b.r*0.06);tctx.stroke();
  tctx.fillStyle=b.on?b.col:'#fff';tctx.font=`${Math.round(b.r*(b.t.length>6?0.32:0.38))}px ${FONT}`;tctx.fillText(b.t,b.x,b.y);
 }
 const P=PAUSEBTN;tctx.globalAlpha=a;
 tctx.fillStyle=P.on?'#fff':'rgba(255,255,255,0.18)';tctx.beginPath();tctx.arc(P.x,P.y,P.r,0,Math.PI*2);tctx.fill();
 tctx.fillStyle=P.on?'#000':'#fff';tctx.fillRect(P.x-P.r*0.32,P.y-P.r*0.4,P.r*0.22,P.r*0.8);tctx.fillRect(P.x+P.r*0.1,P.y-P.r*0.4,P.r*0.22,P.r*0.8);
 tctx.globalAlpha=1;
}

/* ---------- ciclo principale ---------- */
let last=performance.now(),acc=0,ERR=null;
function frame(now){
 try{
  const dt=Math.min(100,now-last);last=now;
  pollInput();
  timeScale=1;
  if(scene==='fight'&&F&&!F.paused&&NET.role!=='guest'){
   if(F.phase==='ko'&&F.pt<45)timeScale=0.35;
   else if(F.spect)timeScale=2;
  }
  acc+=dt/16.6667*timeScale;
  let n=0;
  while(acc>=1&&n<4){TAP=TAPQ;TAPQ=null;step();TAP=null;clearLatches();acc-=1;n++}
  if(n>=4)acc=0;
  if(G3.ok){
   const v=scene==='fight'?'visible':'hidden';if(G3.glc.style.visibility!==v)G3.glc.style.visibility=v;
   // risoluzione automatica: se il telefono non sta dietro, il 3D si disegna con meno pixel
   if(scene==='fight'){
    G3.dtAvg=lerp(G3.dtAvg||16.7,dt,0.05);
    if(++G3.dtN>=45){
     G3.dtN=0;const top=Math.min(DPR,TOUCH?1.25:1.75);let pr=G3.pr||top;
     if(G3.dtAvg>21&&pr>0.55)pr=Math.max(0.55,pr*0.85);else if(G3.dtAvg<17.5&&pr<top)pr=Math.min(top,pr*1.1);
     if(pr!==G3.pr){G3.pr=pr;G3.r.setPixelRatio(pr)}
    }
   }
  }
  if(NOTICE&&--NOTICE.t<=0)NOTICE=null;
  ctx.setTransform(SC*DPR,0,0,SC*DPR,0,0);
  ctx.globalAlpha=1;ctx.filter='none';
  switch(scene){
   case 'title':drawTitle();break;
   case 'menu':drawMenu();break;
   case 'controls':drawControls();break;
   case 'select':drawSelect();break;
   case 'vs':drawVS();break;
   case 'fight':drawFight();break;
   case 'result':drawResult();break;
   case 'lobby':drawLobby();break;
  }
  if(NOTICE){ctx.fillStyle='rgba(0,0,0,0.75)';rr(W/2-300,600,600,56,10);ctx.fill();txt(NOTICE.text,W/2,628,26,'#ff6b6b','center',FONT,4)}
  drawTouch();
 }catch(e){
  if(!ERR){ERR=e;console.error(e)}
  ctx.setTransform(SC*DPR,0,0,SC*DPR,0,0);ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,H-60,W,60);
  txt('Errore: '+e.message,W/2,H-30,18,'#ff6b6b','center',FONT2);
 }
 requestAnimationFrame(frame);
}
init3D();resize();
goTitle();
requestAnimationFrame(frame);
</script>
