<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<meta name="description" content="Scala il 2026: climber verticale. Sali di appiglio in appiglio e conta i metri.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Scala il 2026</title>
<style>
  html,body{height:100%;margin:0;padding:0;background:#08080a;overflow:hidden;overscroll-behavior:none}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#08080a}
  #err{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;text-align:center;padding:28px;
    color:#f2efe6;background:#08080a;
    font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:18px;line-height:1.4;
  }
  #err strong{display:block;font-size:22px;color:#e8c21c;letter-spacing:.04em}
  #err a{
    color:#151206;background:#e8c21c;text-decoration:none;
    padding:11px 26px;border-bottom:3px solid #7a6206;border-radius:3px;font-weight:700;
  }
</style>
</head>
<body>

<iframe id="g" title="Scala il 2026" allow="autoplay; fullscreen"></iframe>

<div id="err">
  <strong>Il gioco non si carica</strong>
  Controlla la connessione e riprova.
  <a id="dir" href="game.html">Apri direttamente</a>
</div>

<script>
/* Guscio anti-cache.
   Questo file non cambia mai, quindi puo restare in cache quanto vuole.
   Il gioco vero sta in game.html e viene chiesto ogni volta con un parametro
   diverso: per il browser e sempre un indirizzo nuovo, quindi non serve mai
   svuotare niente e ogni aggiornamento e visibile all'istante. */
(function(){
  var f   = document.getElementById('g');
  var err = document.getElementById('err');
  var url = 'game.html?v=' + Date.now();
  var caricato = false;

  document.getElementById('dir').href = url;

  f.addEventListener('load', function(){
    caricato = true;
    // la tastiera funziona solo se il frame ha il fuoco (conta sul desktop)
    try { f.contentWindow.focus(); } catch(e){}
  });
  f.src = url;

  // se dopo dieci secondi non e arrivato nulla, mostra una via d'uscita
  setTimeout(function(){
    if (!caricato){ f.style.display = 'none'; err.style.display = 'flex'; }
  }, 10000);

  // un tocco qualsiasi riporta il fuoco dentro al gioco
  addEventListener('pointerdown', function(){
    try { f.contentWindow.focus(); } catch(e){}
  });
})();
</script>

</body>
</html>
